# Configuración autocontenida para validar las plantillas del pool con:
# sudo nginx -t -p "$PWD/" -c test/ops/nginx-production-pool.conf
pid /tmp/data-fut-nginx-pool-test.pid;
error_log stderr notice;

events {}

http {
    access_log off;
    include ../../deploy/nginx-production-upstream.conf;

    server {
        listen 127.0.0.1:18081;

        location / {
            include ../../deploy/nginx-production-proxy-pool.conf;
        }
    }
}
