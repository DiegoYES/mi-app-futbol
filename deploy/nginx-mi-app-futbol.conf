limit_req_zone $binary_remote_addr zone=miappfutbol:10m rate=5r/s;

server {
    listen 80;
    server_name futbol.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name futbol.example.com;

    # Certificados administrados por Certbot o el proveedor de la VM.
    ssl_certificate /etc/letsencrypt/live/futbol.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/futbol.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;

    location / {
        limit_req zone=miappfutbol burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mercado Pago firma el X-Request-Id que envía; debe llegar intacto a
        # Express para validar el webhook. Si no viene, queda vacío.
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }
}
