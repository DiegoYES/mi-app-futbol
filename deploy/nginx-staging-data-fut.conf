# Configuración de ejemplo de Nginx para STAGING (staging.data-fut.com).
# NO reemplaza la configuración activa de producción. Instalación manual:
#   sudo cp deploy/nginx-staging-data-fut.conf /etc/nginx/sites-available/staging-data-fut
#   sudo ln -s /etc/nginx/sites-available/staging-data-fut /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Certificado: certbot certonly --nginx -d staging.data-fut.com

# Zona de rate limiting SEPARADA de la de producción.
# Un navegador moderno solicita recursos y APIs en ráfagas. Staging ya está
# detrás de auth_basic y la aplicación mantiene sus propios límites por API;
# esta capa evita abuso volumétrico sin romper cargas normales ni Playwright.
limit_req_zone $binary_remote_addr zone=miappfutbolstg:10m rate=30r/s;

server {
    listen 80;
    server_name staging.data-fut.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name staging.data-fut.com;

    ssl_certificate /etc/letsencrypt/live/staging.data-fut.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.data-fut.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;

    # --- Protección obligatoria del entorno de prueba -----------------------
    # La allowlist se aprovisiona fuera del repositorio para no versionar IPs:
    #   allow <IP del equipo>;
    #   allow <IP de la propia VM para smoke tests>;
    #   deny all;
    include /etc/nginx/snippets/staging-access.conf;
    #
    # Opción B: restricción por IP (oficina/VPN). Descomenta y ajusta:
    # allow 203.0.113.0/24;   # rango del equipo
    # deny all;
    # -----------------------------------------------------------------------

    # Certbot debe poder renovar el certificado desde sus validadores.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        auth_basic off;
        root /var/www/html;
    }

    # Evita que buscadores indexen el entorno de prueba.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        limit_req zone=miappfutbolstg burst=100 nodelay;
        # Proxy al proceso de staging (puerto 3100, nunca el 3000 de producción).
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mercado Pago incluye X-Request-Id dentro de la firma HMAC. Conservar
        # el valor recibido es obligatorio; Express genera uno cuando falta.
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }
}
