# Reemplaza /etc/nginx/snippets/data-fut-proxy.conf al activar el pool.
proxy_pass http://datafut_node;
proxy_http_version 1.1;
# La aplicación no usa WebSockets. Vaciar Connection permite reutilizar las
# conexiones declaradas por keepalive en el upstream.
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 65s;
