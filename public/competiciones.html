<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Competiciones</title><meta name="theme-color" content="#07100d"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/catalog.css"><script src="/auth-client.js"></script></head>
<body><main class="catalog">
  <nav class="catalog-nav"><a href="/">← Inicio</a><a href="/comparador.html">Comparador</a><a href="/equipos.html">Equipos</a><a href="/jugadores.html">Jugadores</a></nav>
  <header class="catalog-head"><div><p class="eyebrow">Cobertura real</p><h1>Ligas y <span>competiciones.</span></h1><p>No mostramos un catálogo prometido: aquí aparece únicamente lo que existe en la base y cuánto está realmente cubierto.</p></div></header>
  <div id="lista" class="catalog-grid"><div class="loader">Calculando cobertura…</div></div>
</main><script>
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
document.addEventListener('DOMContentLoaded',async()=>{const r=await fetch('/api/home/competiciones');const d=await r.json().catch(()=>({}));const lista=document.getElementById('lista');if(!r.ok){lista.innerHTML=`<div class="warning">${esc(d.error||'No disponible')}</div>`;return}lista.innerHTML=d.competiciones.map(c=>{const pct=c.finalizados?Math.round(c.cobertura.estadisticas/c.finalizados*100):0;return `<a class="catalog-card" href="/competicion.html?id=${c.id}&season=${c.temporada}"><div class="catalog-card-head"><div><h3>${esc(c.nombre)}</h3><p>${esc(c.pais)} · temporada ${c.temporada_etiqueta||c.temporada}</p></div></div><div class="metric-row"><span>Partidos<b>${c.partidos}</b></span><span>Finalizados<b>${c.finalizados}</b></span><span>Con stats<b>${c.cobertura.estadisticas}</b></span></div><div class="coverage"><i style="width:${pct}%"></i></div><small>${pct}% de cobertura avanzada · abrir centro →</small></a>`}).join('')||'<div class="catalog-empty">No hay competiciones guardadas.</div>'});
</script></body></html>
