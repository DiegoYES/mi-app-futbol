<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Competiciones</title><meta name="theme-color" content="#07100d"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/catalog.css"><script src="/auth-client.js"></script></head>
<body><main class="catalog">
  <nav class="catalog-nav"><a href="/">← Inicio</a><a href="/comparador.html">Comparador</a><a href="/equipos.html">Equipos</a><a href="/jugadores.html">Jugadores</a></nav>
  <header class="catalog-head"><div><p class="eyebrow">Cobertura real</p><h1>Ligas y <span>competiciones.</span></h1><p>Una tarjeta por competición. Elige dentro de ella la temporada que quieras consultar y revisa únicamente la cobertura que realmente existe.</p></div><div class="catalog-summary"><strong id="total-ligas">—</strong><span>ligas/torneos únicos</span><small id="total-temporadas">— temporadas guardadas</small></div></header>
  <div id="lista" class="catalog-grid"><div class="loader">Calculando cobertura…</div></div>
</main><script>
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
let competiciones=[];
const temporadasElegidas=new Map();
function temporadaActiva(competencia){const elegida=temporadasElegidas.get(competencia.id);return competencia.temporadas.find(t=>t.temporada===elegida)||competencia.temporadas[0]}
function pintar(){
  const lista=document.getElementById('lista');
  lista.innerHTML=competiciones.map(c=>{const t=temporadaActiva(c);const pct=t.finalizados?Math.round(t.cobertura.estadisticas/t.finalizados*100):0;return `<article class="catalog-card competition-directory-card"><div class="catalog-card-head"><img src="/api/ligas/${c.id}/logo" alt="Logo de ${esc(c.nombre)}"><div><h3>${esc(c.nombre)}</h3><p>${esc(c.pais)} · ${c.temporadas.length} temporada${c.temporadas.length===1?'':'s'} en la base</p></div></div><label class="competition-season-picker"><span>Temporada</span><select data-competition-season="${c.id}">${c.temporadas.map(item=>`<option value="${item.temporada}" ${item.temporada===t.temporada?'selected':''}>${esc(item.etiqueta)}</option>`).join('')}</select></label><div class="metric-row"><span>Partidos<b>${t.partidos}</b></span><span>Finalizados<b>${t.finalizados}</b></span><span>Con stats<b>${t.cobertura.estadisticas}</b></span></div><div class="coverage"><i style="width:${pct}%"></i></div><div class="competition-card-foot"><small>${t.finalizados?`${pct}% de cobertura avanzada`:'Temporada sin partidos finalizados'}</small><a href="/competicion.html?id=${c.id}&season=${t.temporada}">Abrir temporada →</a></div></article>`}).join('')||'<div class="catalog-empty">No hay competiciones guardadas.</div>';
}
document.addEventListener('DOMContentLoaded',async()=>{const r=await fetch('/api/home/competiciones');const d=await r.json().catch(()=>({}));const lista=document.getElementById('lista');if(!r.ok){lista.innerHTML=`<div class="warning">${esc(d.error||'No disponible')}</div>`;return}competiciones=d.competiciones||[];document.getElementById('total-ligas').textContent=d.total??competiciones.length;document.getElementById('total-temporadas').textContent=`${d.temporadas_guardadas??competiciones.reduce((n,c)=>n+c.temporadas.length,0)} temporadas guardadas`;lista.addEventListener('change',event=>{const select=event.target.closest('[data-competition-season]');if(!select)return;temporadasElegidas.set(Number(select.dataset.competitionSeason),Number(select.value));pintar()});pintar()});
</script></body></html>
