<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Competiciones</title>
<link rel="icon" href="/brand-mark.svg" type="image/svg+xml"><meta name="theme-color" content="#07100d"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/catalog.css"><script src="/auth-client.js?v=20260827-v9"></script></head>
<body><main class="catalog">
  <nav class="catalog-nav"><a href="/">← Inicio</a><a href="/comparador.html">Comparador</a><a href="/equipos.html">Equipos</a><a href="/jugadores.html">Jugadores</a></nav>
  <header class="catalog-head"><div><p class="eyebrow">Cobertura real</p><h1>Ligas y <span>competiciones.</span></h1><p>Una tarjeta por competición. Elige dentro de ella la temporada que quieras consultar y revisa únicamente la cobertura que realmente existe.</p></div><div class="catalog-summary"><strong id="total-ligas">—</strong><span>ligas/torneos únicos</span><small id="total-temporadas">— temporadas guardadas</small></div></header>
  <div id="lista" class="catalog-grid"><div class="loader">Calculando cobertura…</div></div>
</main><script>
function aplicarAnchos(){document.querySelectorAll("[data-width]").forEach(el=>{el.style.width=Math.max(0,Math.min(100,Number(el.dataset.width)||0))+"%"})}
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
let competiciones=[];
const temporadasElegidas=new Map();
function normalizarCatalogo(lista){
  const porLiga=new Map();
  for(const item of lista||[]){
    if(Array.isArray(item.temporadas)){
      porLiga.set(Number(item.id),{...item,temporadas:[...item.temporadas].sort((a,b)=>b.temporada-a.temporada)});
      continue;
    }
    const id=Number(item.id);
    if(!porLiga.has(id))porLiga.set(id,{id,nombre:item.nombre,pais:item.pais,principal:item.principal,temporadas:[],resumen:{partidos:0,finalizados:0,cobertura:{estadisticas:0,detalles:0,jugadores:0}}});
    const liga=porLiga.get(id);
    const temporada={temporada:Number(item.temporada),etiqueta:item.temporada_etiqueta||String(item.temporada),partidos:Number(item.partidos)||0,finalizados:Number(item.finalizados)||0,cobertura:item.cobertura||{estadisticas:0,detalles:0,jugadores:0},desde:item.desde||null,hasta:item.hasta||null};
    liga.temporadas.push(temporada);
    liga.resumen.partidos+=temporada.partidos;
    liga.resumen.finalizados+=temporada.finalizados;
    for(const clave of ['estadisticas','detalles','jugadores'])liga.resumen.cobertura[clave]+=Number(temporada.cobertura[clave])||0;
  }
  return [...porLiga.values()].map(liga=>({...liga,temporadas:liga.temporadas.sort((a,b)=>b.temporada-a.temporada)})).sort((a,b)=>Number(b.principal)-Number(a.principal)||a.nombre.localeCompare(b.nombre,'es'));
}
function temporadaActiva(competencia){const elegida=temporadasElegidas.get(competencia.id);return competencia.temporadas.find(t=>t.temporada===elegida)||competencia.temporadas[0]}
function pintar(){
  const lista=document.getElementById('lista');
  lista.innerHTML=competiciones.map(c=>{const t=temporadaActiva(c);const pct=t.finalizados?Math.round(t.cobertura.estadisticas/t.finalizados*100):0;return `<article class="catalog-card competition-directory-card"><div class="catalog-card-head"><img src="/api/ligas/${c.id}/logo" alt="Logo de ${esc(c.nombre)}"><div><h3>${esc(c.nombre)}</h3><p>${esc(c.pais)} · ${c.temporadas.length} temporada${c.temporadas.length===1?'':'s'} en la base</p></div></div><label class="competition-season-picker"><span>Temporada</span><select data-competition-season="${c.id}">${c.temporadas.map(item=>`<option value="${item.temporada}" ${item.temporada===t.temporada?'selected':''}>${esc(item.etiqueta)}</option>`).join('')}</select></label><div class="metric-row"><span>Partidos<b>${t.partidos}</b></span><span>Finalizados<b>${t.finalizados}</b></span><span>Con stats<b>${t.cobertura.estadisticas}</b></span></div><div class="coverage"><i data-width="${pct}"></i></div><div class="competition-card-foot"><small>${t.finalizados?`${pct}% de cobertura avanzada`:'Temporada sin partidos finalizados'}</small><a href="/competicion.html?id=${c.id}&season=${t.temporada}">Abrir temporada →</a></div></article>`}).join('')||'<div class="catalog-empty">No hay competiciones guardadas.</div>';aplicarAnchos();
}
document.addEventListener('DOMContentLoaded',async()=>{const lista=document.getElementById('lista');try{const r=await fetch('/api/home/competiciones');const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No disponible');competiciones=normalizarCatalogo(d.competiciones);const temporadas=competiciones.reduce((n,c)=>n+c.temporadas.length,0);document.getElementById('total-ligas').textContent=competiciones.length;document.getElementById('total-temporadas').textContent=`${temporadas} temporadas guardadas`;lista.addEventListener('change',event=>{const select=event.target.closest('[data-competition-season]');if(!select)return;temporadasElegidas.set(Number(select.dataset.competitionSeason),Number(select.value));pintar()});pintar()}catch(error){lista.innerHTML=`<div class="warning">No se pudo calcular la cobertura: ${esc(error.message)}</div>`}});
</script></body></html>
