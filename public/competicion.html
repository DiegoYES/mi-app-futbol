<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centro de competencia</title><meta name="theme-color" content="#07100d"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/catalog.css"><script src="/auth-client.js"></script></head>
<body><main class="catalog competition-center">
  <nav class="catalog-nav"><a href="/competiciones.html">← Competiciones</a><a href="/">Inicio</a><a href="/comparador.html">Comparador</a><a id="teams-link" href="/equipos.html">Equipos</a></nav>
  <header class="catalog-head"><div class="competition-identity"><img id="competition-logo" alt=""><div><p class="eyebrow">Centro de competencia</p><h1 id="title">Cargando <span>temporada.</span></h1><p id="subtitle">Clasificación reconstruida, cobertura y últimos partidos guardados.</p></div></div><label class="competition-center-season"><span>Temporada</span><select id="season" aria-label="Temporada"></select></label></header>
  <section class="competition-kpis" id="kpis"></section>
  <div id="notice" class="method-note"></div>
  <section class="competition-layout"><article class="competition-panel"><div class="competition-panel-head"><div><p class="eyebrow">Rendimiento</p><h2>Clasificación</h2></div><a id="compare-link" href="/comparador.html">Comparar equipos →</a></div><div class="table-scroll"><table class="standings"><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>DG</th><th>PTS</th></tr></thead><tbody id="standings"></tbody></table></div></article>
  <aside class="competition-panel"><div class="competition-panel-head"><div><p class="eyebrow">Archivo</p><h2>Últimos partidos</h2></div></div><div id="recent" class="competition-matches"></div></aside></section>
</main><script>
const params=new URLSearchParams(location.search);const ID=Number(params.get('id'));const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
async function cargar(){if(!Number.isInteger(ID)){document.getElementById('title').textContent='Competición inválida';return}const season=document.getElementById('season').value||params.get('season')||'';const r=await fetch(`/api/home/competiciones/${ID}${season?`?season=${season}`:''}`);const d=await r.json().catch(()=>({}));if(!r.ok){document.getElementById('title').textContent=d.error||'No disponible';return}const etiqueta=d.competencia.temporada_etiqueta||d.competencia.temporada;document.title=`${d.competencia.nombre} ${etiqueta}`;document.getElementById('competition-logo').src=`/api/ligas/${ID}/logo`;document.getElementById('competition-logo').alt=`Logo de ${d.competencia.nombre}`;document.getElementById('title').innerHTML=`${esc(d.competencia.nombre)} <span>${esc(etiqueta)}.</span>`;document.getElementById('subtitle').textContent=`${d.competencia.pais} · ${d.resumen.finalizados} partidos finalizados en la base.`;const sel=document.getElementById('season');sel.innerHTML=d.competencia.temporadas_etiquetas.map(t=>`<option value="${t.temporada}" ${t.temporada===d.competencia.temporada?'selected':''}>${esc(t.etiqueta)}</option>`).join('');document.getElementById('teams-link').href=`/equipos.html?league=${ID}&season=${d.competencia.temporada}`;document.getElementById('compare-link').href=`/comparador.html?leagueLocal=${ID}&seasonLocal=${d.competencia.temporada}`;document.getElementById('kpis').innerHTML=[['Partidos',d.resumen.partidos],['Finalizados',d.resumen.finalizados],['Goles',d.resumen.goles],['Goles / partido',d.resumen.goles_por_partido??'—'],['Con estadísticas',d.resumen.estadisticas],['Con jugadores',d.resumen.jugadores]].map(([n,v])=>`<div><span>${n}</span><strong>${v}</strong></div>`).join('');document.getElementById('notice').textContent=d.clasificacion_oficial?'Tabla reconstruida con los marcadores finales almacenados.':'En copas, esta tabla resume el rendimiento acumulado guardado; no representa necesariamente el formato o clasificación oficial del torneo.';document.getElementById('standings').innerHTML=d.clasificacion.map((e,i)=>`<tr><td>${i+1}</td><td><a href="/equipo.html?id=${e.id}&league=${ID}&season=${d.competencia.temporada}"><img src="/api/equipos/${e.id}/escudo" alt=""><span>${esc(e.nombre)}</span></a></td><td>${e.jugados}</td><td>${e.ganados}</td><td>${e.empatados}</td><td>${e.perdidos}</td><td>${e.diferencia>0?'+':''}${e.diferencia}</td><td><b>${e.puntos}</b></td></tr>`).join('')||'<tr><td colspan="8">Sin partidos finalizados.</td></tr>';document.getElementById('recent').innerHTML=d.recientes.map(p=>{const dia=new Date(p.fecha).toISOString().slice(0,10);return `<a href="/partido.html?local=${p.local.id}&visitante=${p.visitante.id}&liga=${ID}&partido=${p.api_id}&fecha=${dia}"><time>${new Date(p.fecha).toLocaleDateString('es-MX',{day:'2-digit',month:'short'})}</time><span>${esc(p.local.nombre)} <b>${p.local.goles??'–'} · ${p.visitante.goles??'–'}</b> ${esc(p.visitante.nombre)}</span></a>`}).join('')||'<div class="catalog-empty">Sin partidos.</div>';history.replaceState(null,'',`/competicion.html?id=${ID}&season=${d.competencia.temporada}`)}
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('season').onchange=cargar;cargar()});
</script></body></html>
