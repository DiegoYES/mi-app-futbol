<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de administración</title>
<link rel="icon" href="/brand-mark.svg" type="image/svg+xml">
<script src="/auth-client.js"></script>
<style>
  :root { --primary: #0a2540; --accent: #00d4ff; --bg: #f3f4f6; }
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: #334155; margin: 0; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
  h1 { color: var(--primary); font-size: 1.6rem; margin: 0 0 20px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .kpi { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
  .kpi .label { font-size: .78rem; color: #64748b; text-transform: uppercase; letter-spacing: .04em; }
  .kpi .value { font-size: 1.9rem; font-weight: 700; color: var(--primary); }
  .barra { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  input[type=search] { flex: 1; min-width: 220px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
  .table-scroll { width:100%;overflow-x:auto;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.07);-webkit-overflow-scrolling:touch; }
  table { width: 100%; min-width:900px; background: #fff; border-collapse: collapse; }
  th { background: var(--primary); color: #fff; padding: 11px; text-align: left; font-size: .82rem; }
  td { padding: 11px; border-bottom: 1px solid #eef2f7; font-size: .87rem; }
  tr:hover td { background: #f8fafc; }
  .badge { padding: 3px 9px; border-radius: 11px; font-size: .74rem; font-weight: 600; }
  .badge.premium { background: #dcfce7; color: #166534; }
  .badge.prueba { background: #dbeafe; color: #1e40af; }
  .badge.expirado { background: #fee2e2; color: #991b1b; }
  .badge.admin { background: #fef3c7; color: #92400e; }
  .badge.suspendido { background: #fef3c7; color: #92400e; }
  .badge.bloq-ip { background: #fee2e2; color: #7f1d1d; }
  .acciones button { min-height:40px;padding: 7px 10px; margin-right: 4px; margin-bottom: 4px; border: none; border-radius: 6px; cursor: pointer; font-size: .78rem; }
  .btn-mes { background: var(--primary); color: #fff; }
  .btn-cortesia { background: #d1fae5; color: #065f46; }
  .btn-suspender { background: #fef3c7; color: #92400e; }
  .btn-levantar { background: #e0f2fe; color: #075985; }
  .btn-desbloquear-ip { background: #ede9fe; color: #5b21b6; }
  .btn-off { background: #fee2e2; color: #991b1b; }
  .btn-on { background: #dcfce7; color: #166534; }
  .vacio { text-align: center; padding: 32px; color: #94a3b8; }
  .ip-text { font-size: .75rem; color: #64748b; font-family: monospace; }
  .seccion { margin-top: 32px; }
  .seccion h2 { font-size: 1.1rem; color: var(--primary); margin-bottom: 12px; }
  .mercados-panel { background:#fff;border-radius:10px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.07); }
  .mercados-actions { display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px; }
  .btn-mercados { border:0;border-radius:8px;background:var(--primary);color:#fff;padding:10px 14px;cursor:pointer;min-height:42px; }
  .btn-mercados:disabled { opacity:.55;cursor:wait; }
  .mercados-status { font-size:.88rem;color:#64748b; }
  .diag-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px; }
  .diag-item { background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:11px;overflow-wrap:anywhere; }
  .diag-item b { display:block;color:var(--primary);font-size:1.15rem; }
  .ticket-tools { display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px; }
  .ticket-tools select { min-height:40px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#334155; }
  .admin-tickets { display:grid;gap:12px; }
  .admin-ticket { background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.05); }
  .admin-ticket-head { display:flex;justify-content:space-between;gap:14px;align-items:flex-start; }
  .admin-ticket h3 { margin:3px 0 5px;color:var(--primary);font-size:1rem; }
  .admin-ticket-meta { color:#64748b;font-size:.75rem; }
  .admin-ticket-desc { white-space:pre-wrap;overflow-wrap:anywhere;font-size:.86rem;line-height:1.5; }
  .ticket-edit { display:grid;grid-template-columns:140px 140px minmax(220px,1fr) auto;gap:9px;align-items:end;margin-top:13px;padding-top:13px;border-top:1px solid #e2e8f0; }
  .ticket-edit label { display:block;color:#64748b;font-size:.68rem;margin-bottom:4px; }
  .ticket-edit select,.ticket-edit textarea { width:100%;min-height:40px;padding:8px;border:1px solid #cbd5e1;border-radius:7px;font:inherit; }
  .ticket-edit textarea { min-height:64px;resize:vertical; }
  .btn-ticket { min-height:40px;border:0;border-radius:7px;background:var(--primary);color:#fff;padding:9px 13px;cursor:pointer; }
  .ticket-empty { padding:25px;text-align:center;color:#94a3b8;background:#fff;border-radius:10px; }
  .rec-panel { display:grid;grid-template-columns:minmax(320px,.9fr) minmax(380px,1.1fr);gap:16px;align-items:start; }
  .rec-form,.rec-card { background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.05); }
  .rec-form-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px; }
  .rec-form label { display:block;color:#64748b;font-size:.7rem;font-weight:700; }
  .rec-form input,.rec-form select,.rec-form textarea { width:100%;min-height:42px;margin-top:5px;padding:9px;border:1px solid #cbd5e1;border-radius:7px;font:inherit; }
  .rec-form textarea { min-height:88px;resize:vertical; }
  .rec-wide { grid-column:1/-1; }
  .rec-check { display:flex!important;align-items:center;gap:8px;min-height:42px;color:#334155!important; }
  .rec-check input { width:auto;min-height:auto;margin:0; }
  .rec-selections { display:grid;gap:8px;margin:12px 0; }
  .rec-selection { display:grid;grid-template-columns:1.2fr 1.2fr 80px 100px auto;gap:7px;padding:9px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px; }
  .rec-selection input { min-width:0;margin:0; }
  .rec-actions { display:flex;gap:8px;flex-wrap:wrap; }
  .rec-actions button { min-height:42px;border:0;border-radius:7px;padding:9px 13px;cursor:pointer; }
  .rec-primary { background:var(--primary);color:#fff; }
  .rec-secondary { background:#e2e8f0;color:#334155; }
  .rec-danger { background:#fee2e2;color:#991b1b; }
  .rec-list { display:grid;gap:10px; }
  .rec-card-head { display:flex;justify-content:space-between;gap:12px; }
  .rec-card h3 { margin:5px 0;color:var(--primary);font-size:1rem; }
  .rec-card p { margin:8px 0;color:#64748b;font-size:.8rem;white-space:pre-wrap; }
  .rec-card ol { margin:9px 0;padding-left:20px;font-size:.8rem; }
  .rec-card-meta { color:#64748b;font-size:.7rem; }
  @media(max-width:900px){.rec-panel{grid-template-columns:1fr}}
  @media(max-width:800px){.ticket-edit{grid-template-columns:1fr 1fr}.ticket-edit>div:nth-child(3){grid-column:1/-1}.admin-ticket-head{display:block}.rec-selection{grid-template-columns:1fr 1fr}.rec-selection button{grid-column:1/-1}}
  @media(max-width:600px){.wrap{padding:18px 12px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.kpi{padding:13px}.barra{flex-direction:column}input[type=search]{width:100%;min-width:0;min-height:44px}.acciones button{min-height:44px}.ticket-edit{grid-template-columns:1fr}.ticket-edit>div:nth-child(3){grid-column:auto}}
  @media(max-width:360px){.kpis{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠️ Panel de administración</h1>

  <div class="kpis" id="kpis"></div>

  <div class="seccion">
    <h2>🎯 Picks y parlays recomendados</h2>
    <div class="rec-panel">
      <form class="rec-form" id="rec-form">
        <input type="hidden" id="rec-id">
        <div class="rec-form-grid">
          <label>Tipo<select id="rec-tipo"><option value="pick">Pick individual</option><option value="parlay">Parlay</option></select></label>
          <label>Acceso<select id="rec-visibilidad"><option value="premium">Premium</option><option value="gratis">Gratis</option></select></label>
          <label>Publicación<select id="rec-publicacion"><option value="borrador">Borrador</option><option value="publicada">Publicar</option></select></label>
          <label>Resultado<select id="rec-resultado"><option value="pendiente">Pendiente</option><option value="acertado">Acertado</option><option value="fallado">Fallado</option><option value="anulado">Anulado</option></select></label>
          <label class="rec-wide">Título<input id="rec-titulo" maxlength="140" required placeholder="Ej. Pick destacado del viernes"></label>
          <label class="rec-wide">Análisis<textarea id="rec-descripcion" maxlength="3000" placeholder="Explica brevemente por qué lo recomendamos"></textarea></label>
          <label>Fecha y hora límite<input id="rec-cierra" type="datetime-local" required></label>
          <label>Cuota total<input id="rec-cuota-total" type="number" min="1" max="100000" step="0.01" placeholder="Opcional"></label>
          <label class="rec-check rec-wide"><input id="rec-destacada" type="checkbox"> Destacar esta recomendación</label>
        </div>
        <div id="rec-selecciones" class="rec-selections"></div>
        <div class="rec-actions">
          <button class="rec-secondary" id="rec-agregar" type="button">+ Añadir selección</button>
          <button class="rec-primary" id="rec-guardar" type="submit">Crear recomendación</button>
          <button class="rec-secondary" id="rec-cancelar" type="button" hidden>Cancelar edición</button>
        </div>
      </form>
      <div id="rec-lista" class="rec-list"><div class="ticket-empty">Cargando recomendaciones…</div></div>
    </div>
  </div>

  <div class="seccion">
    <h2>Mercados de Playdoit</h2>
    <div class="mercados-panel">
      <div class="mercados-actions">
        <button class="btn-mercados" id="actualizar-mercados" type="button">Actualizar mercados</button>
        <span class="mercados-status" id="estado-mercados">Consultando diagnóstico…</span>
      </div>
      <div class="diag-grid" id="diagnostico-mercados"></div>
    </div>
  </div>

  <div class="seccion">
    <h2>💡 Sugerencias y tickets</h2>
    <div class="ticket-tools">
      <select id="filtro-ticket-estado">
        <option value="">Todos los estados</option>
        <option value="nueva">Nuevos</option>
        <option value="en_revision">En revisión</option>
        <option value="planeada">Planeados</option>
        <option value="resuelta">Resueltos</option>
        <option value="descartada">Descartados</option>
      </select>
      <select id="filtro-ticket-tipo">
        <option value="">Todos los tipos</option>
        <option value="idea">Ideas</option>
        <option value="mejora">Mejoras</option>
        <option value="error">Errores</option>
        <option value="otro">Otros</option>
      </select>
    </div>
    <div class="admin-tickets" id="admin-tickets"><div class="ticket-empty">Cargando tickets…</div></div>
  </div>

  <div class="barra">
    <input type="search" id="busqueda" placeholder="Buscar por email o nombre...">
  </div>

  <div class="table-scroll"><table>
    <thead>
      <tr><th>Usuario</th><th>IP</th><th>Plan</th><th>Vence</th><th>Registro</th><th>Último acceso</th><th>Acciones</th></tr>
    </thead>
    <tbody id="tbody"><tr><td colspan="7" class="vacio">Cargando...</td></tr></tbody>
  </table></div>

  <div class="seccion">
    <h2>⚠️ IPs duplicadas</h2>
    <div id="ips-duplicadas"><p style="color:#94a3b8">Cargando...</p></div>
  </div>
</div>

<script>
let temporizador;

function escaparHtml(valor) {
  return String(valor ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function fecha(valor) {
  if (!valor) return '—';
  return new Date(valor).toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
}

function fechaLocalInput(valor) {
  if (!valor) return '';
  const fechaValor = new Date(valor);
  const local = new Date(fechaValor.getTime() - fechaValor.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 16);
}

function agregarSeleccion(datos = {}) {
  const fila = document.createElement('div');
  fila.className = 'rec-selection';
  fila.innerHTML = `<input data-rec="evento" maxlength="140" required placeholder="Partido o evento" value="${escaparHtml(datos.evento || '')}">
    <input data-rec="mercado" maxlength="180" required placeholder="Mercado recomendado" value="${escaparHtml(datos.mercado || '')}">
    <input data-rec="cuota" type="number" min="1" max="1000" step="0.01" placeholder="Cuota" value="${escaparHtml(datos.cuota ?? '')}">
    <input data-rec="casa" maxlength="80" placeholder="Casa" value="${escaparHtml(datos.casa || '')}">
    <button class="rec-danger" type="button" data-rec-quitar>Quitar</button>`;
  document.getElementById('rec-selecciones').appendChild(fila);
}

function ajustarSelecciones() {
  const contenedor = document.getElementById('rec-selecciones');
  if (!contenedor.children.length) agregarSeleccion();
  if (document.getElementById('rec-tipo').value === 'pick') {
    while (contenedor.children.length > 1) contenedor.lastElementChild.remove();
  }
  document.getElementById('rec-agregar').disabled = document.getElementById('rec-tipo').value === 'pick';
}

function limpiarRecomendacion() {
  document.getElementById('rec-form').reset();
  document.getElementById('rec-id').value = '';
  document.getElementById('rec-selecciones').innerHTML = '';
  document.getElementById('rec-guardar').textContent = 'Crear recomendación';
  document.getElementById('rec-cancelar').hidden = true;
  agregarSeleccion();
  ajustarSelecciones();
}

function datosRecomendacionFormulario() {
  const cierreLocal = document.getElementById('rec-cierra').value;
  return {
    tipo: document.getElementById('rec-tipo').value,
    titulo: document.getElementById('rec-titulo').value,
    descripcion: document.getElementById('rec-descripcion').value,
    visibilidad: document.getElementById('rec-visibilidad').value,
    estado_publicacion: document.getElementById('rec-publicacion').value,
    resultado: document.getElementById('rec-resultado').value,
    destacada: document.getElementById('rec-destacada').checked,
    cuota_total: document.getElementById('rec-cuota-total').value,
    cierra_en: cierreLocal ? new Date(cierreLocal).toISOString() : '',
    selecciones: [...document.querySelectorAll('.rec-selection')].map(fila => ({
      evento: fila.querySelector('[data-rec="evento"]').value,
      mercado: fila.querySelector('[data-rec="mercado"]').value,
      cuota: fila.querySelector('[data-rec="cuota"]').value,
      casa: fila.querySelector('[data-rec="casa"]').value
    }))
  };
}

async function guardarRecomendacion(evento) {
  evento.preventDefault();
  const id = document.getElementById('rec-id').value;
  const boton = document.getElementById('rec-guardar');
  boton.disabled = true;
  try {
    const respuesta = await fetch(id ? `/api/admin/recomendaciones/${id}` : '/api/admin/recomendaciones', {
      method: id ? 'PATCH' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(datosRecomendacionFormulario())
    });
    const datos = await respuesta.json().catch(() => ({}));
    if (!respuesta.ok) throw new Error(datos.error || 'No se pudo guardar la recomendación.');
    limpiarRecomendacion();
    await cargarRecomendacionesAdmin();
  } catch (error) {
    alert(error.message);
  } finally {
    boton.disabled = false;
  }
}

let recomendacionesAdmin = [];

async function cargarRecomendacionesAdmin() {
  const contenedor = document.getElementById('rec-lista');
  const respuesta = await fetch('/api/admin/recomendaciones');
  const datos = await respuesta.json().catch(() => ({}));
  if (!respuesta.ok) {
    contenedor.innerHTML = `<div class="ticket-empty">${escaparHtml(datos.error || 'No se pudieron cargar.')}</div>`;
    return;
  }
  recomendacionesAdmin = datos.recomendaciones;
  if (!recomendacionesAdmin.length) {
    contenedor.innerHTML = '<div class="ticket-empty">Todavía no hay picks ni parlays editoriales.</div>';
    return;
  }
  contenedor.innerHTML = recomendacionesAdmin.map(item => `<article class="rec-card" data-rec-id="${item._id}">
    <div class="rec-card-head"><div><span class="rec-card-meta">${item.tipo === 'parlay' ? 'PARLAY' : 'PICK'} · ${escaparHtml(item.visibilidad)} · ${escaparHtml(item.estado_publicacion)}</span><h3>${escaparHtml(item.titulo)}</h3></div><span class="badge ${item.resultado === 'acertado' ? 'premium' : item.resultado === 'fallado' ? 'expirado' : 'prueba'}">${escaparHtml(item.resultado)}</span></div>
    ${item.descripcion ? `<p>${escaparHtml(item.descripcion)}</p>` : ''}
    <ol>${item.selecciones.map(seleccion => `<li><strong>${escaparHtml(seleccion.evento)}</strong> · ${escaparHtml(seleccion.mercado)}${seleccion.cuota ? ` @ ${seleccion.cuota}` : ''}</li>`).join('')}</ol>
    <div class="rec-card-meta">Cierra ${fecha(item.cierra_en)}${item.cuota_total ? ` · Cuota total ${item.cuota_total}` : ''}${item.destacada ? ' · ⭐ Destacada' : ''}</div>
    <div class="rec-actions" style="margin-top:11px"><button class="rec-secondary" type="button" data-rec-editar="${item._id}">Editar</button><button class="rec-danger" type="button" data-rec-eliminar="${item._id}">Eliminar</button></div>
  </article>`).join('');
}

function editarRecomendacion(id) {
  const item = recomendacionesAdmin.find(recomendacion => recomendacion._id === id);
  if (!item) return;
  document.getElementById('rec-id').value = item._id;
  document.getElementById('rec-tipo').value = item.tipo;
  document.getElementById('rec-visibilidad').value = item.visibilidad;
  document.getElementById('rec-publicacion').value = item.estado_publicacion;
  document.getElementById('rec-resultado').value = item.resultado;
  document.getElementById('rec-titulo').value = item.titulo;
  document.getElementById('rec-descripcion').value = item.descripcion || '';
  document.getElementById('rec-cierra').value = fechaLocalInput(item.cierra_en);
  document.getElementById('rec-cuota-total').value = item.cuota_total || '';
  document.getElementById('rec-destacada').checked = item.destacada;
  document.getElementById('rec-selecciones').innerHTML = '';
  item.selecciones.forEach(agregarSeleccion);
  ajustarSelecciones();
  document.getElementById('rec-guardar').textContent = 'Guardar cambios';
  document.getElementById('rec-cancelar').hidden = false;
  document.getElementById('rec-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function eliminarRecomendacion(id) {
  if (!confirm('¿Eliminar definitivamente esta recomendación?')) return;
  const respuesta = await fetch(`/api/admin/recomendaciones/${id}`, { method: 'DELETE' });
  const datos = await respuesta.json().catch(() => ({}));
  if (!respuesta.ok) return alert(datos.error || 'No se pudo eliminar.');
  if (document.getElementById('rec-id').value === id) limpiarRecomendacion();
  cargarRecomendacionesAdmin();
}

function buscarConRetraso() {
  clearTimeout(temporizador);
  temporizador = setTimeout(cargarUsuarios, 350);
}

async function cargarResumen() {
  const resp = await fetch('/api/admin/resumen');
  if (!resp.ok) return;
  const d = await resp.json();
  const cortesias = d.mesesCortesia || 0;
  const ingresoReal = Math.max(0, d.premium - cortesias) * 50;
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="label">Usuarios</div><div class="value">${d.total}</div></div>
    <div class="kpi"><div class="label">Premium</div><div class="value">${d.premium}</div></div>
    <div class="kpi"><div class="label">En prueba</div><div class="value">${d.enPrueba}</div></div>
    <div class="kpi"><div class="label">Expirados</div><div class="value">${d.expirados}</div></div>
    <div class="kpi"><div class="label">Ingreso mensual real</div><div class="value">$${ingresoReal}</div></div>
    <div class="kpi"><div class="label">Cortesías activas</div><div class="value">${cortesias}</div></div>
    <div class="kpi"><div class="label">API hoy</div><div class="value">${d.cuotaApi.usadas}/${d.cuotaApi.disponibles_para_uso}</div></div>
    <div class="kpi"><div class="label">Tickets abiertos</div><div class="value">${d.ticketsAbiertos || 0}</div></div>`;
}

const ESTADOS_TICKET = {
  nueva:'Nueva', en_revision:'En revisión', planeada:'Planeada', resuelta:'Resuelta', descartada:'Descartada'
};
const TIPOS_TICKET = { idea:'Idea', mejora:'Mejora', error:'Error', otro:'Otro' };
const PRIORIDADES_TICKET = { baja:'Baja', media:'Media', alta:'Alta', urgente:'Urgente' };

function opcionesTicket(opciones, actual) {
  return Object.entries(opciones).map(([valor, etiqueta]) =>
    `<option value="${valor}" ${valor === actual ? 'selected' : ''}>${etiqueta}</option>`).join('');
}

async function cargarTickets() {
  const estado = document.getElementById('filtro-ticket-estado').value;
  const tipo = document.getElementById('filtro-ticket-tipo').value;
  const params = new URLSearchParams({ limite: '100' });
  if (estado) params.set('estado', estado);
  if (tipo) params.set('tipo', tipo);
  const contenedor = document.getElementById('admin-tickets');
  const resp = await fetch('/api/admin/sugerencias?' + params);
  const datos = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    contenedor.innerHTML = `<div class="ticket-empty">${escaparHtml(datos.error || 'No se pudieron cargar los tickets.')}</div>`;
    return;
  }
  if (!datos.tickets.length) {
    contenedor.innerHTML = '<div class="ticket-empty">No hay tickets con estos filtros.</div>';
    return;
  }
  contenedor.innerHTML = datos.tickets.map(ticket => `
    <article class="admin-ticket" data-ticket="${ticket._id}">
      <div class="admin-ticket-head">
        <div><span class="admin-ticket-meta">${escaparHtml(TIPOS_TICKET[ticket.tipo])} · ${fecha(ticket.creada_en)}</span><h3>${escaparHtml(ticket.asunto)}</h3><span class="admin-ticket-meta">${escaparHtml(ticket.usuario?.nombre || 'Usuario eliminado')} · ${escaparHtml(ticket.usuario?.email || 'sin email')}</span></div>
        <span class="badge ${ticket.estado === 'resuelta' ? 'premium' : ticket.estado === 'descartada' ? 'expirado' : 'prueba'}">${escaparHtml(ESTADOS_TICKET[ticket.estado])}</span>
      </div>
      <p class="admin-ticket-desc">${escaparHtml(ticket.descripcion)}</p>
      <div class="ticket-edit">
        <div><label>Estado</label><select data-campo="estado">${opcionesTicket(ESTADOS_TICKET, ticket.estado)}</select></div>
        <div><label>Prioridad</label><select data-campo="prioridad">${opcionesTicket(PRIORIDADES_TICKET, ticket.prioridad)}</select></div>
        <div><label>Respuesta al usuario</label><textarea maxlength="2000" data-campo="respuesta">${escaparHtml(ticket.respuesta_admin || '')}</textarea></div>
        <button class="btn-ticket" type="button" data-accion="guardar-ticket">Guardar</button>
      </div>
    </article>`).join('');
}

async function actualizarTicket(id, boton) {
  const tarjeta = document.querySelector(`[data-ticket="${id}"]`);
  boton.disabled = true;
  boton.textContent = 'Guardando…';
  try {
    const resp = await fetch(`/api/admin/sugerencias/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        estado: tarjeta.querySelector('[data-campo="estado"]').value,
        prioridad: tarjeta.querySelector('[data-campo="prioridad"]').value,
        respuesta_admin: tarjeta.querySelector('[data-campo="respuesta"]').value
      })
    });
    const datos = await resp.json();
    if (!resp.ok) throw new Error(datos.error || 'No se pudo guardar.');
    boton.textContent = 'Guardado ✓';
    await cargarResumen();
    setTimeout(() => cargarTickets(), 500);
  } catch (error) {
    alert(error.message);
    boton.disabled = false;
    boton.textContent = 'Guardar';
  }
}

async function cargarUsuarios() {
  const q = document.getElementById('busqueda').value.trim();
  const resp = await fetch('/api/admin/usuarios?limite=200&q=' + encodeURIComponent(q));
  if (!resp.ok) return;

  const { usuarios } = await resp.json();
  const tbody = document.getElementById('tbody');

  if (!usuarios.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="vacio">Sin resultados</td></tr>';
    return;
  }

  tbody.innerHTML = usuarios.map(u => {
    const clase = u.rol === 'admin' ? 'admin' : u.plan;
    const etiqueta = u.rol === 'admin' ? 'admin' : u.plan;
    const esSuspendido = u.suspendido_hasta && new Date(u.suspendido_hasta) > new Date();
    const esBloqIP = u.bloqueado_ip_duplicada;
    const estadoBadges = [
      !u.activo ? '<span class="badge expirado">desactivado</span>' : '',
      esSuspendido ? `<span class="badge suspendido">suspendido</span>` : '',
      esBloqIP ? '<span class="badge bloq-ip">bloq. IP</span>' : ''
    ].filter(Boolean).join(' ');
    return `<tr>
      <td><strong>${escaparHtml(u.nombre || '—')}</strong><br><span style="color:#64748b">${escaparHtml(u.email)}</span>
        ${estadoBadges ? '<br>' + estadoBadges : ''}</td>
      <td class="ip-text">${escaparHtml(u.ip_registro || '—')}</td>
      <td><span class="badge ${clase}">${etiqueta}</span>
        ${u.diasRestantes != null ? `<br><small>${u.diasRestantes} día(s)</small>` : ''}</td>
      <td>${fecha(u.suscripcion_termina || u.prueba_termina)}</td>
      <td>${fecha(u.fecha_registro)}</td>
      <td>${fecha(u.ultimo_acceso)}</td>
      <td class="acciones">
        <button type="button" class="btn-mes" data-accion="extender" data-usuario="${u.id}" data-meses="1">+1 mes</button>
        <button type="button" class="btn-mes" data-accion="extender" data-usuario="${u.id}" data-meses="3">+3 meses</button>
        <button type="button" class="btn-cortesia" data-accion="cortesia" data-usuario="${u.id}">🎁 Cortesía</button>
        ${esSuspendido
          ? `<button type="button" class="btn-levantar" data-accion="levantar" data-usuario="${u.id}">✅ Levantar</button>`
          : `<button type="button" class="btn-suspender" data-accion="suspender" data-usuario="${u.id}">⏸ Suspender</button>`}
        ${esBloqIP ? `<button type="button" class="btn-desbloquear-ip" data-accion="desbloquear-ip" data-usuario="${u.id}">🔓 Desbloquear IP</button>` : ''}
        <button type="button" class="${u.activo ? 'btn-off' : 'btn-on'}" data-accion="alternar" data-usuario="${u.id}" data-activo="${!u.activo}">${u.activo ? 'Desactivar' : 'Activar'}</button>
      </td>
    </tr>`;
  }).join('');
}

async function cargarDiagnosticoMercados() {
  const resp = await fetch('/api/admin/mercados/diagnostico');
  if (!resp.ok) return;
  const d = await resp.json();
  const ultima = d.ultima_actualizacion;
  document.getElementById('estado-mercados').textContent = ultima
    ? `Última ejecución: ${new Date(ultima.iniciada_en).toLocaleString('es-MX')} · ${ultima.estado}`
    : 'Todavía no hay actualizaciones registradas.';
  const problemas = (d.problemas_normalizacion || []).reduce((suma, item) => suma + item.total, 0);
  document.getElementById('diagnostico-mercados').innerHTML = `
    <div class="diag-item"><span>Selecciones vigentes</span><b>${d.selecciones_vigentes || 0}</b></div>
    <div class="diag-item"><span>Detectadas</span><b>${ultima?.selecciones_detectadas || 0}</b></div>
    <div class="diag-item"><span>Guardadas</span><b>${ultima?.selecciones_guardadas || 0}</b></div>
    <div class="diag-item"><span>Eventos</span><b>${ultima?.eventos || 0}</b></div>
    <div class="diag-item"><span>Problemas</span><b>${problemas + (ultima?.problemas?.length || 0)}</b></div>
    <div class="diag-item"><span>Estrategia</span><b style="font-size:.9rem">${escaparHtml(ultima?.estrategia || '—')}</b></div>`;
}

async function actualizarMercados() {
  const boton = document.getElementById('actualizar-mercados');
  boton.disabled = true;
  document.getElementById('estado-mercados').textContent = 'Abriendo navegador y recolectando mercados…';
  try {
    const resp = await fetch('/api/admin/mercados/actualizar', { method: 'POST' });
    const d = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(d.error || d.resultado?.problemas?.[0]?.mensaje || 'La actualización no obtuvo mercados.');
  } catch (error) {
    document.getElementById('estado-mercados').textContent = `No se pudo actualizar: ${error.message}`;
  } finally {
    boton.disabled = false;
    await cargarDiagnosticoMercados();
  }
}

async function extender(id, meses) {
  const resp = await fetch(`/api/admin/usuarios/${id}/suscripcion`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ meses })
  });
  const d = await resp.json();
  if (!resp.ok) return alert(d.error);
  refrescar();
}

async function cortesia(id) {
  if (!confirm('¿Aplicar 1 mes de cortesía? No se contará como ingreso.')) return;
  const resp = await fetch(`/api/admin/usuarios/${id}/cortesia`, { method: 'POST' });
  const d = await resp.json();
  if (!resp.ok) return alert(d.error);
  refrescar();
}

async function suspender(id) {
  const dias = prompt('¿Cuántos días suspender? (1-365)');
  if (!dias) return;
  const resp = await fetch(`/api/admin/usuarios/${id}/suspender`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dias: parseInt(dias) })
  });
  const d = await resp.json();
  if (!resp.ok) return alert(d.error);
  refrescar();
}

async function levantarSuspension(id) {
  const resp = await fetch(`/api/admin/usuarios/${id}/suspension`, { method: 'DELETE' });
  const d = await resp.json();
  if (!resp.ok) return alert(d.error);
  refrescar();
}

async function desbloquearIP(id) {
  if (!confirm('¿Desbloquear esta cuenta? (solo cuando el usuario pague)')) return;
  const resp = await fetch(`/api/admin/usuarios/${id}/bloqueo-ip`, { method: 'DELETE' });
  const d = await resp.json();
  if (!resp.ok) return alert(d.error);
  refrescar();
}

async function cargarIPsDuplicadas() {
  const resp = await fetch('/api/admin/ips-duplicadas');
  if (!resp.ok) return;
  const { duplicadas } = await resp.json();
  const cont = document.getElementById('ips-duplicadas');
  if (!duplicadas.length) {
    cont.innerHTML = '<p style="color:#94a3b8">No hay IPs duplicadas.</p>';
    return;
  }
  cont.innerHTML = duplicadas.map(d => `
    <div style="background:#fff;border-radius:8px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.07)">
      <strong class="ip-text">${escaparHtml(d._id)}</strong> — <span style="color:#991b1b">${d.cuentas} cuentas</span>
      <ul style="margin:6px 0 0;padding-left:20px">
        ${d.usuarios.map(u => `<li>${escaparHtml(u.nombre || u.email)} <span class="badge ${u.bloqueado ? 'bloq-ip' : u.plan}">${u.bloqueado ? 'bloqueado' : u.plan}</span></li>`).join('')}
      </ul>
    </div>`).join('');
}

async function alternar(id, activo) {
  const resp = await fetch(`/api/admin/usuarios/${id}/activo`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ activo })
  });
  const d = await resp.json();
  if (!resp.ok) return alert(d.error);
  refrescar();
}

function refrescar() {
  cargarResumen();
  cargarUsuarios();
  cargarIPsDuplicadas();
  cargarDiagnosticoMercados();
  cargarTickets();
  cargarRecomendacionesAdmin();
}

function instalarEventos() {
  document.getElementById('rec-form').addEventListener('submit', guardarRecomendacion);
  document.getElementById('rec-tipo').addEventListener('change', ajustarSelecciones);
  document.getElementById('rec-agregar').addEventListener('click', () => agregarSeleccion());
  document.getElementById('rec-cancelar').addEventListener('click', limpiarRecomendacion);
  document.getElementById('rec-selecciones').addEventListener('click', evento => {
    const boton = evento.target.closest('[data-rec-quitar]');
    if (!boton) return;
    boton.closest('.rec-selection').remove();
    ajustarSelecciones();
  });
  document.getElementById('rec-lista').addEventListener('click', evento => {
    const editar = evento.target.closest('[data-rec-editar]');
    const eliminar = evento.target.closest('[data-rec-eliminar]');
    if (editar) editarRecomendacion(editar.dataset.recEditar);
    if (eliminar) eliminarRecomendacion(eliminar.dataset.recEliminar);
  });
  document.getElementById('actualizar-mercados').addEventListener('click', actualizarMercados);
  document.getElementById('filtro-ticket-estado').addEventListener('change', cargarTickets);
  document.getElementById('filtro-ticket-tipo').addEventListener('change', cargarTickets);
  document.getElementById('busqueda').addEventListener('input', buscarConRetraso);

  document.getElementById('admin-tickets').addEventListener('click', evento => {
    const boton = evento.target.closest('[data-accion="guardar-ticket"]');
    if (!boton) return;
    const tarjeta = boton.closest('[data-ticket]');
    if (tarjeta) actualizarTicket(tarjeta.dataset.ticket, boton);
  });

  document.getElementById('tbody').addEventListener('click', evento => {
    const boton = evento.target.closest('button[data-accion][data-usuario]');
    if (!boton) return;
    const id = boton.dataset.usuario;
    switch (boton.dataset.accion) {
      case 'extender': extender(id, Number(boton.dataset.meses)); break;
      case 'cortesia': cortesia(id); break;
      case 'suspender': suspender(id); break;
      case 'levantar': levantarSuspension(id); break;
      case 'desbloquear-ip': desbloquearIP(id); break;
      case 'alternar': alternar(id, boton.dataset.activo === 'true'); break;
    }
  });
}

document.addEventListener('DOMContentLoaded', () => {
  limpiarRecomendacion();
  instalarEventos();
  refrescar();
});
</script>
</body>
</html>
