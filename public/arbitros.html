<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Árbitros</title><meta name="theme-color" content="#07100d"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/catalog.css"><script src="/auth-client.js"></script></head>
<body><main class="catalog">
  <nav class="catalog-nav"><a href="/">← Inicio</a><a href="/comparador.html">Comparador</a><a href="/competiciones.html">Competiciones</a><a href="/jugadores.html">Jugadores</a></nav>
  <header class="catalog-head"><div><p class="eyebrow">Disciplina y ritmo</p><h1>Perfiles de <span>árbitros.</span></h1><p>Promedios confirmados por competición; las tarjetas y faltas solo se calculan donde existe cobertura avanzada.</p></div></header>
  <div class="catalog-controls"><select id="liga"><option value="">Selecciona competición</option></select></div>
  <div id="lista" class="catalog-grid"><div class="catalog-empty">Selecciona una competición.</div></div>
</main><script>
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
async function cargar(){const [id,season]=document.getElementById('liga').value.split(':');if(!id||!season)return;const lista=document.getElementById('lista');lista.innerHTML='<div class="loader">Calculando perfiles…</div>';const r=await fetch(`/api/arbitros?league=${id}&season=${season}`);const d=await r.json().catch(()=>({}));if(!r.ok){lista.innerHTML=`<div class="warning">${esc(d.error||'No disponible')}</div>`;return}lista.innerHTML=d.arbitros.map(a=>`<article class="catalog-card"><h3>${esc(a.nombre)}</h3><div class="metric-row"><span>Partidos<b>${a.partidos}</b></span><span>Goles/P<b>${a.promedios.goles??'—'}</b></span><span>Amarillas/P<b>${a.promedios.amarillas??'—'}</b></span></div><small>Cobertura avanzada ${a.cobertura_avanzada}/${a.partidos} · faltas/P ${a.promedios.faltas??'—'}</small></article>`).join('')||'<div class="catalog-empty">No hay árbitros guardados para esta competición y temporada.</div>'}
document.addEventListener('DOMContentLoaded',async()=>{const r=await fetch('/api/home/competiciones');const d=await r.json();document.getElementById('liga').innerHTML='<option value="">Selecciona competición y temporada</option>'+d.competiciones.map(c=>`<option value="${c.id}:${c.temporada}">${esc(c.nombre)} · ${c.temporada_etiqueta||c.temporada}</option>`).join('');document.getElementById('liga').onchange=cargar});
</script></body></html>
