<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario de partidos</title>
<link rel="icon" href="/brand-mark.svg" type="image/svg+xml">
<meta name="theme-color" content="#07100d">
<link rel="stylesheet" href="/styles.css">
<script src="/auth-client.js"></script>
<script src="/search-utils.js"></script>
<script src="/match-score.js"></script>
<script src="/user-library.js"></script>
<link rel="stylesheet" href="/calendario.css?v=20260824-modules">
</head>
<body data-product-event="calendar_view">
<div class="container">
  <div class="cal-top">
    <div>
      <h1>📅 Calendario</h1>
      <p id="subtitulo">Elige una fecha para ver los encuentros</p>
    </div>
    <a href="/comparador.html" style="color:var(--green);text-decoration:none">⚽ Ir al comparador →</a>
  </div>

  <div class="calendar-tools">
    <div class="calendar-search">
      <label class="search-field" for="busquedaCalendario">
        <span aria-hidden="true">⌕</span>
        <input id="busquedaCalendario" type="search" autocomplete="off" placeholder="Buscar liga, equipo o país" aria-label="Buscar liga, equipo o país" aria-expanded="false" aria-controls="resultadosBusqueda">
        <button id="limpiarBusqueda" type="button" aria-label="Limpiar búsqueda">×</button>
      </label>
      <div id="resultadosBusqueda" class="search-results" role="listbox" hidden></div>
    </div>
    <label class="date-picker" for="selectorFecha"><span aria-hidden="true">📅</span><input type="date" id="selectorFecha"></label>
  </div>
  <div id="filtroActivo" class="active-filter"></div>
  <div class="calendar-filters" aria-label="Filtros de partidos">
    <div class="calendar-filter-group" aria-label="Estado del partido">
      <span>Estado</span>
      <button class="status-filter active" type="button" data-status-filter="todos">Todos</button>
      <button class="status-filter" type="button" data-status-filter="terminado">Terminados</button>
      <button class="status-filter" type="button" data-status-filter="en_juego">En juego</button>
      <button class="status-filter" type="button" data-status-filter="no_iniciado">No empezados</button>
      <button class="status-filter" type="button" data-status-filter="sin_confirmar">Sin confirmar</button>
      <button class="status-filter" type="button" data-status-filter="favoritos">★ Favoritos</button>
    </div>
    <div class="calendar-filter-group hour-filter" aria-label="Rango de hora local">
      <span>Hora local</span>
      <label>Desde <input id="horaDesde" type="time" step="1800" aria-label="Hora desde"></label>
      <label>Hasta <input id="horaHasta" type="time" step="1800" aria-label="Hora hasta"></label>
    </div>
    <button id="limpiarFiltrosVisuales" class="clear-display-filters" type="button" hidden>Restablecer estado y hora</button>
  </div>
  <div class="quick-dates" id="chips" aria-label="Días del calendario"></div>

  <section id="daily-picks" class="daily-picks" aria-live="polite"></section>
  <div id="contenido"><div class="vacio">Cargando...</div></div>
</div>

<script src="/calendario.js?v=20260824-modules"></script>
<script src="/product-events.js" defer></script>
</body>
</html>
