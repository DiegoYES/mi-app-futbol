<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario de partidos</title>
<meta name="theme-color" content="#07100d">
<link rel="stylesheet" href="/styles.css">
<script src="/auth-client.js"></script>
<style>
  .cal-top { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; }
  .cal-top h1 { margin: 0 0 4px; font-size: 1.7rem; }
  .cal-top p { margin: 0; color: var(--muted); font-size: .9rem; }

  .date-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-bottom: 12px; }
  .date-bar button { background: var(--surface-soft); color: var(--ink); border: 1px solid var(--line); border-radius: 9px; padding: 8px 14px; cursor: pointer; }
  .date-bar button:hover { border-color: var(--green); color: var(--green); }
  .date-bar button.primary { background: var(--green-dark); border-color: var(--green-dark); color: #fff; }
  .date-bar input[type=date] { background: var(--surface-soft); color: var(--ink); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; }
  .date-label { flex: 1; min-width: 200px; text-align: center; font-weight: 600; text-transform: capitalize; }

  .quick-dates { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px; margin-bottom: 18px; }
  .chip { flex: 0 0 auto; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; cursor: pointer; text-align: center; min-width: 78px; }
  .chip:hover { border-color: var(--green); }
  .chip.active { background: var(--green-dark); border-color: var(--green); }
  .chip .dow { display: block; font-size: .7rem; color: var(--muted); text-transform: uppercase; }
  .chip.active .dow { color: rgba(255,255,255,.85); }
  .chip .dnum { display: block; font-size: 1.15rem; font-weight: 700; }
  .chip .badge-n { display: block; font-size: .66rem; color: var(--green); }
  .chip.active .badge-n { color: #fff; }

  .liga-group { background: var(--surface-raised); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 16px; overflow: hidden; }
  .liga-head { background: var(--surface-soft); padding: 11px 18px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .liga-head .pais { font-size: .78rem; color: var(--muted); font-weight: 400; }

  .match { display: grid; grid-template-columns: 62px 1fr auto 1fr; align-items: center; gap: 12px; padding: 13px 18px; border-top: 1px solid var(--line); cursor: pointer; transition: background .15s; }
  .match:hover { background: rgba(84,227,142,.07); }
  .match .hora { font-size: .82rem; color: var(--muted); }
  .match .estado-live { color: var(--green); font-weight: 700; }
  .equipo { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .equipo.der { flex-direction: row-reverse; text-align: right; }
  .equipo img { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }
  .equipo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .marcador { font-weight: 700; font-size: 1.05rem; background: var(--surface-soft); border-radius: 8px; padding: 4px 12px; min-width: 58px; text-align: center; }
  .marcador.vs { color: var(--muted); font-weight: 400; font-size: .8rem; background: transparent; }

  .vacio { text-align: center; padding: 48px 20px; color: var(--muted); background: var(--surface-raised); border: 1px solid var(--line); border-radius: 14px; }
  .vacio strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 8px; }
  .vacio a { color: var(--green); }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button { background: var(--surface-raised); color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 9px 18px; cursor: pointer; font-size: .9rem; font-weight: 600; }
  .tabs button.active { background: var(--green-dark); border-color: var(--green); color: #fff; }
  .tabs button:hover:not(.active) { border-color: var(--green); color: var(--green); }

  .dia-bloque { margin-bottom: 26px; }
  .dia-titulo { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--line); }
  .dia-titulo h2 { margin: 0; font-size: 1.15rem; text-transform: capitalize; }
  .dia-titulo .cuenta { font-size: .8rem; color: var(--muted); }
  .dia-vacio { color: var(--muted); font-size: .85rem; padding: 10px 4px; }
  @media(max-width:700px) {
    .cal-top { align-items:flex-start;flex-direction:column;gap:12px; }
    .tabs { overflow-x:auto;scroll-snap-type:x proximity; }
    .tabs button { flex:1 0 auto;min-height:44px;scroll-snap-align:start; }
    .date-bar { display:grid;grid-template-columns:1fr 1fr;padding:12px; }
    .date-label { grid-column:1/-1;grid-row:1;min-width:0; }
    .date-bar input[type=date],.date-bar .primary { width:100%;min-height:44px; }
    .quick-dates { scroll-snap-type:x proximity; }
    .chip { min-height:60px;scroll-snap-align:start; }
    .match { grid-template-columns:50px minmax(0,1fr) auto;padding:13px 12px;gap:8px; }
    .match .hora { grid-row:1 / span 2; }
    .equipo,.equipo.der { grid-column:2;flex-direction:row;text-align:left; }
    .marcador { grid-column:3;grid-row:1 / span 2; }
    .liga-head { padding-inline:12px;gap:8px; }
  }
  @media(max-width:380px) {
    .date-bar { grid-template-columns:1fr; }
    .date-label,.date-bar>* { grid-column:1; }
    .date-bar button { width:100%; }
    .match { grid-template-columns:minmax(0,1fr) auto; }
    .match .hora { grid-column:1/-1;grid-row:auto; }
    .equipo,.equipo.der { grid-column:1; }
    .marcador { grid-column:2;grid-row:2 / span 2; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="cal-top">
    <div>
      <h1>📅 Calendario de partidos</h1>
      <p id="subtitulo">Elige una fecha para ver los encuentros</p>
    </div>
    <a href="/comparador.html" style="color:var(--green);text-decoration:none">⚽ Ir al comparador →</a>
  </div>

  <div class="tabs">
    <button id="tabProximos" class="active" onclick="cambiarVista('proximos')">📆 Próximos 7 días</button>
    <button id="tabDia" onclick="cambiarVista('dia')">🗓️ Por fecha</button>
  </div>

  <div id="controlesDia" style="display:none">
    <div class="date-bar">
      <button onclick="mover(-1)">‹ Anterior</button>
      <span class="date-label" id="etiquetaFecha">—</span>
      <button onclick="mover(1)">Siguiente ›</button>
      <input type="date" id="selectorFecha" onchange="irA(this.value)">
      <button class="primary" onclick="irA(hoyISO())">Hoy</button>
    </div>

    <div class="quick-dates" id="chips"></div>
  </div>

  <div id="contenido"><div class="vacio">Cargando...</div></div>
</div>

<script>
let fechaActual = hoyISO();
let vistaActual = 'proximos';

function hoyISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function esc(valor) {
  return String(valor ?? '')
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
}

function aDate(iso) {
  const [a, m, d] = iso.split('-').map(Number);
  return new Date(a, m - 1, d);
}

function aISO(fecha) {
  return `${fecha.getFullYear()}-${String(fecha.getMonth() + 1).padStart(2, '0')}-${String(fecha.getDate()).padStart(2, '0')}`;
}

function mover(dias) {
  const f = aDate(fechaActual);
  f.setDate(f.getDate() + dias);
  irA(aISO(f));
}

function irA(iso) {
  if (!iso) return;
  fechaActual = iso;
  document.getElementById('selectorFecha').value = iso;
  history.replaceState(null, '', '?fecha=' + iso);
  pintarChips();
  if (vistaActual !== 'dia') return cambiarVista('dia');
  cargar();
}

function pintarChips() {
  const base = aDate(fechaActual);
  const cont = document.getElementById('chips');
  let html = '';
  for (let i = -3; i <= 3; i++) {
    const f = new Date(base);
    f.setDate(base.getDate() + i);
    const iso = aISO(f);
    html += `<div class="chip ${i === 0 ? 'active' : ''}" onclick="irA('${iso}')">
      <span class="dow">${f.toLocaleDateString('es-MX', { weekday: 'short' })}</span>
      <span class="dnum">${f.getDate()}</span>
      <span class="badge-n" data-dia="${iso}"></span>
    </div>`;
  }
  cont.innerHTML = html;
}

function pintarCompeticiones(competiciones, fechaRef) {
  const etiquetasEstado = {
    PST: 'Aplazado',
    CANC: 'Cancelado',
    Canc: 'Cancelado',
    ABD: 'Abandonado',
    AWD: 'Adjudicado',
    WO: 'Walkover',
    SUSP: 'Suspendido',
    INT: 'Interrumpido',
    '1H': 'En vivo',
    HT: 'Descanso',
    '2H': 'En vivo',
    ET: 'Prórroga',
    BT: 'Pausa'
  };
  return competiciones.map(c => `
    <div class="liga-group">
      <div class="liga-head">
        <span>${esc(c.liga)}</span>
        <span class="pais">${esc(c.pais)}</span>
      </div>
      ${c.partidos.map(p => {
        const estadoVisible = p.finalizado ? 'Final' : (etiquetasEstado[p.estado] || p.hora);
        const marcador = p.finalizado
          ? `<div class="marcador">${p.local.goles} - ${p.visitante.goles}</div>`
          : `<div class="marcador vs">vs</div>`;
        return `<div class="match" onclick="abrirPartido(${p.local.id},${p.visitante.id},${c.liga_id},${p.api_id},'${fechaRef}')">
          <div class="hora">${esc(estadoVisible)}</div>
          <div class="equipo">
            <img src="/api/equipos/${p.local.id}/escudo" alt="">
            <span>${esc(p.local.nombre)}</span>
          </div>
          ${marcador}
          <div class="equipo der">
            <img src="/api/equipos/${p.visitante.id}/escudo" alt="">
            <span>${esc(p.visitante.nombre)}</span>
          </div>
        </div>`;
      }).join('')}
    </div>`).join('');
}

async function cargarProximos() {
  const cont = document.getElementById('contenido');
  cont.innerHTML = '<div class="vacio">Cargando próximos partidos...</div>';

  try {
    const resp = await fetch('/api/calendario/proximos?dias=7');
    if (!resp.ok) throw new Error('respuesta no válida');
    const datos = await resp.json();

    document.getElementById('subtitulo').textContent =
      datos.total ? `${datos.total} partido(s) en los próximos 7 días` : 'Sin partidos en los próximos 7 días';

    if (!datos.total) {
      const rango = await (await fetch('/api/calendario/rango')).json();
      cont.innerHTML = `<div class="vacio">
        <strong>No hay partidos programados esta semana</strong>
        Tu base de datos tiene partidos del <b>${rango.desde || '—'}</b> al <b>${rango.hasta || '—'}</b>.
      </div>`;
      return;
    }

    cont.innerHTML = datos.jornadas.map(d => `
      <div class="dia-bloque">
        <div class="dia-titulo">
          <h2>${esc(d.etiqueta)}</h2>
          <span class="cuenta">${d.total ? `${d.total} partido(s)` : ''}</span>
        </div>
        ${d.total
          ? pintarCompeticiones(d.competiciones, d.fecha)
          : '<div class="dia-vacio">Sin partidos programados</div>'}
      </div>`).join('');
  } catch (err) {
    cont.innerHTML = '<div class="vacio">No se pudieron cargar los partidos</div>';
  }
}

function cambiarVista(modo) {
  vistaActual = modo;
  document.getElementById('tabProximos').classList.toggle('active', modo === 'proximos');
  document.getElementById('tabDia').classList.toggle('active', modo === 'dia');
  document.getElementById('controlesDia').style.display = modo === 'dia' ? '' : 'none';
  history.replaceState(null, '', modo === 'dia' ? '?fecha=' + fechaActual : location.pathname);
  if (modo === 'proximos') cargarProximos();
  else cargar();
}

async function cargar() {
  const cont = document.getElementById('contenido');
  cont.innerHTML = '<div class="vacio">Cargando partidos...</div>';

  const f = aDate(fechaActual);
  document.getElementById('etiquetaFecha').textContent =
    f.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  try {
    const resp = await fetch('/api/calendario/dia?fecha=' + fechaActual);
    if (!resp.ok) return;
    const datos = await resp.json();

    document.getElementById('subtitulo').textContent =
      datos.total ? `${datos.total} partido(s) en ${datos.competiciones.length} competición(es)` : 'Sin partidos programados';

    if (!datos.total) {
      const rango = await (await fetch('/api/calendario/rango')).json();
      cont.innerHTML = `<div class="vacio">
        <strong>No hay partidos en esta fecha</strong>
        Tu base de datos tiene partidos del <b>${rango.desde || '—'}</b> al <b>${rango.hasta || '—'}</b>.
        <br><br>
        <a href="?fecha=${rango.hasta}" onclick="irA('${rango.hasta}');return false;">Ver la última fecha con partidos →</a>
      </div>`;
      return;
    }

    cont.innerHTML = pintarCompeticiones(datos.competiciones, fechaActual);
  } catch (err) {
    cont.innerHTML = '<div class="vacio">No se pudieron cargar los partidos</div>';
  }
}

function abrirPartido(local, visitante, liga, apiId, fechaRef) {
  window.location.href = `/partido.html?local=${local}&visitante=${visitante}&liga=${liga}&partido=${apiId}&fecha=${fechaRef || fechaActual}`;
}

document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(location.search);
  const fechaParam = params.get('fecha');
  fechaActual = fechaParam || hoyISO();
  document.getElementById('selectorFecha').value = fechaActual;
  pintarChips();
  // Si llega con ?fecha= se abre en modo día; si no, en próximos 7 días
  cambiarVista(fechaParam ? 'dia' : 'proximos');
});
</script>
</body>
</html>
