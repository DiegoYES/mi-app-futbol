<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipos</title><meta name="theme-color" content="#07100d"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/catalog.css"><script src="/auth-client.js"></script><script src="/search-utils.js"></script><script src="/user-library.js"></script></head>
<body><main class="catalog">
  <nav class="catalog-nav"><a href="/">← Inicio</a><a href="/comparador.html">Comparador</a><a href="/competiciones.html">Competiciones</a><a href="/jugadores.html">Jugadores</a></nav>
  <header class="catalog-head"><div><p class="eyebrow">Directorio</p><h1>Explora los <span>equipos.</span></h1><p>Selecciona una competición y envía cualquier club directamente al lado local o visitante del comparador.</p></div></header>
  <div class="catalog-controls"><select id="liga"><option value="">Selecciona competición</option></select><input id="buscar" type="search" placeholder="Prueba “Madrid Real” o “Re Mad”…"><span id="resultados" class="catalog-result-count" aria-live="polite"></span></div>
  <div id="lista" class="catalog-grid"><div class="catalog-empty">Selecciona una competición.</div></div>
</main><script>
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');let equipos=[];
function contexto(){const [league,season]=document.getElementById('liga').value.split(':').map(Number);return {league,season}}
function pintar(){const q=document.getElementById('buscar').value;const {league,season}=contexto();const visibles=FutbolSearch.ordenar(equipos,q,e=>e.nombre);document.getElementById('resultados').textContent=equipos.length?`${visibles.length} de ${equipos.length} equipos`:'';document.getElementById('lista').innerHTML=visibles.map(e=>`<article class="catalog-card team-directory-card"><button class="favorite-button ${FutbolLibrary.esFavorito(e.id,league)?'active':''}" type="button" data-favorite="${e.id}" aria-label="Guardar ${esc(e.nombre)} como favorito">${FutbolLibrary.esFavorito(e.id,league)?'★':'☆'}</button><a href="/equipo.html?id=${e.id}&league=${league}&season=${season}" class="catalog-card-head" style="color:inherit;text-decoration:none"><img src="/api/equipos/${e.id}/escudo" alt="Escudo de ${esc(e.nombre)}" loading="lazy"><div><h3>${esc(e.nombre)}</h3><p>Ver ficha y tendencias →</p></div></a><small><a href="/comparador.html?local=${e.id}&leagueLocal=${league}&seasonLocal=${season}" style="color:var(--green)">Usar como local</a> · <a href="/comparador.html?visitante=${e.id}&leagueVisitante=${league}&seasonVisitante=${season}" style="color:var(--cyan)">Usar como visitante</a></small></article>`).join('')||'<div class="catalog-empty">No encontramos equipos con todos esos fragmentos. Prueba menos letras o cambia la competición.</div>'}
async function cargarEquipos(){const {league,season}=contexto();if(!Number.isInteger(league)||!Number.isInteger(season)){equipos=[];pintar();return}const r=await fetch(`/api/ligas/${league}/equipos?season=${season}`);equipos=await r.json();pintar()}
document.addEventListener('DOMContentLoaded',async()=>{const r=await fetch('/api/home/competiciones');const d=await r.json();const sel=document.getElementById('liga');sel.innerHTML='<option value="">Selecciona competición y temporada</option>'+d.competiciones.map(c=>`<option value="${c.id}:${c.temporada}">${esc(c.nombre)} · ${c.temporada_etiqueta||c.temporada}</option>`).join('');const p=new URLSearchParams(location.search);const ligaInicial=p.get('league');const temporadaInicial=p.get('season');if(ligaInicial){const exacta=temporadaInicial?`${ligaInicial}:${temporadaInicial}`:[...sel.options].find(o=>o.value.startsWith(`${ligaInicial}:`))?.value;sel.value=exacta||'';if(sel.value)await cargarEquipos()}sel.onchange=cargarEquipos;document.getElementById('buscar').oninput=pintar;document.getElementById('lista').onclick=e=>{const b=e.target.closest('[data-favorite]');if(!b)return;const equipo=equipos.find(x=>String(x.id)===b.dataset.favorite);const {league}=contexto();if(equipo){FutbolLibrary.alternarFavorito({...equipo,league,competicion:sel.selectedOptions[0]?.text});pintar()}}});
</script></body></html>
