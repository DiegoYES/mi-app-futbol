<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipos</title><meta name="theme-color" content="#07100d"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/catalog.css"><script src="/auth-client.js"></script><script src="/search-utils.js"></script><script src="/user-library.js"></script></head>
<body><main class="catalog">
  <nav class="catalog-nav"><a href="/">← Inicio</a><a href="/comparador.html">Comparador</a><a href="/competiciones.html">Competiciones</a><a href="/jugadores.html">Jugadores</a></nav>
  <header class="catalog-head"><div><p class="eyebrow">Directorio</p><h1>Explora los <span>equipos.</span></h1><p>Selecciona una liga, abre un equipo y elige dentro de su ficha la temporada que quieras analizar.</p></div></header>
  <div class="catalog-controls"><select id="liga"><option value="">Selecciona competición</option></select><input id="buscar" type="search" placeholder="Prueba “Madrid Real” o “Re Mad”…"><span id="resultados" class="catalog-result-count" aria-live="polite"></span></div>
  <div id="lista" class="catalog-grid"><div class="catalog-empty">Selecciona una competición.</div></div>
</main><script>
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');let equipos=[];
function contexto(){return {league:Number(document.getElementById('liga').value)}}
function pintar(){const q=document.getElementById('buscar').value;const {league}=contexto();const visibles=FutbolSearch.ordenar(equipos,q,e=>e.nombre);document.getElementById('resultados').textContent=equipos.length?`${visibles.length} de ${equipos.length} equipos`:'';document.getElementById('lista').innerHTML=visibles.map(e=>`<article class="catalog-card team-directory-card"><button class="favorite-button ${FutbolLibrary.esFavorito(e.id,league)?'active':''}" type="button" data-favorite="${e.id}" aria-label="Guardar ${esc(e.nombre)} como favorito">${FutbolLibrary.esFavorito(e.id,league)?'★':'☆'}</button><a href="/equipo.html?id=${e.id}&league=${league}" class="catalog-card-head" style="color:inherit;text-decoration:none"><img src="/api/equipos/${e.id}/escudo" alt="Escudo de ${esc(e.nombre)}" loading="lazy"><div><h3>${esc(e.nombre)}</h3><p>${e.temporadas?.length||1} temporada${e.temporadas?.length===1?'':'s'} disponible${e.temporadas?.length===1?'':'s'} · ver ficha →</p></div></a><small><a href="/comparador.html?local=${e.id}&leagueLocal=${league}" style="color:var(--green)">Usar como local</a> · <a href="/comparador.html?visitante=${e.id}&leagueVisitante=${league}" style="color:var(--cyan)">Usar como visitante</a></small></article>`).join('')||'<div class="catalog-empty">No encontramos equipos con todos esos fragmentos. Prueba menos letras o cambia la competición.</div>'}
async function cargarEquipos(){const {league}=contexto();if(!Number.isInteger(league)||league<=0){equipos=[];pintar();return}const r=await fetch(`/api/ligas/${league}/equipos?allSeasons=true`);equipos=await r.json();pintar()}
function normalizarLigas(lista){const porId=new Map();for(const item of lista||[]){const id=Number(item.id);if(!porId.has(id)||Number(item.temporada)>Number(porId.get(id).temporada))porId.set(id,item)}return [...porId.values()].sort((a,b)=>Number(b.principal)-Number(a.principal)||a.nombre.localeCompare(b.nombre,'es'))}
document.addEventListener('DOMContentLoaded',async()=>{const r=await fetch('/api/home/competiciones');const d=await r.json();const sel=document.getElementById('liga');const ligas=normalizarLigas(d.competiciones);sel.innerHTML='<option value="">Selecciona una liga</option>'+ligas.map(c=>`<option value="${c.id}">${esc(c.nombre)} · ${esc(c.pais)}</option>`).join('');const p=new URLSearchParams(location.search);const ligaInicial=p.get('league');if(ligaInicial){sel.value=ligaInicial;if(sel.value)await cargarEquipos()}sel.onchange=()=>{history.replaceState(null,'',sel.value?`/equipos.html?league=${sel.value}`:'/equipos.html');cargarEquipos()};document.getElementById('buscar').oninput=pintar;document.getElementById('lista').onclick=e=>{const b=e.target.closest('[data-favorite]');if(!b)return;const equipo=equipos.find(x=>String(x.id)===b.dataset.favorite);const {league}=contexto();if(equipo){FutbolLibrary.alternarFavorito({...equipo,league,competicion:sel.selectedOptions[0]?.text});pintar()}}});
</script></body></html>
