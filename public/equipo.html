<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ficha del equipo</title>
<link rel="icon" href="/brand-mark.svg" type="image/svg+xml">
  <meta name="theme-color" content="#07100d">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/catalog.css">
  <script src="/auth-client.js"></script>
  <script src="/user-library.js"></script>
  <style>
    .team-page{width:min(1240px,calc(100% - 32px));margin:auto;padding:38px 0 72px}
    .team-nav{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:22px}.team-nav a{color:var(--muted);font-size:.76rem;font-weight:800;text-decoration:none}.team-nav a:first-child{color:var(--green)}
    .team-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end;padding:clamp(24px,5vw,50px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(84,227,142,.11),rgba(16,26,23,.94) 48%);box-shadow:var(--shadow)}
    .team-identity{display:flex;align-items:center;gap:20px}.team-logo{width:86px;height:86px;object-fit:contain;padding:10px;border-radius:22px;background:#f4f8f5}.team-identity h1{margin:2px 0 0;font-size:clamp(2.2rem,5vw,4.4rem);line-height:.95;letter-spacing:-.055em}.team-sub{margin:13px 0 0;color:var(--muted);font-size:.82rem}
    .team-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.team-actions a,.team-actions button{display:grid;place-items:center;min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface-soft);color:var(--ink);font-size:.72rem;font-weight:850;text-decoration:none}.team-actions a:hover,.team-actions button:hover{border-color:var(--green)}
    .profile-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0;padding:12px;border:1px solid var(--line);border-radius:15px;background:var(--surface)}.profile-controls label{color:var(--muted);font-size:.7rem;font-weight:800}.profile-controls select{width:auto;min-width:155px}.coverage-label{margin-left:auto;color:var(--muted);font-size:.7rem}
    .profile-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:14px}.profile-card{padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}.profile-card h2{margin:0 0 15px;font-size:1rem}.profile-card h2 small{margin-left:6px;color:var(--muted);font-size:.64rem;font-weight:500}
    .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.kpi{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--surface-raised)}.kpi span{display:block;color:var(--muted);font-size:.58rem;font-weight:800;text-transform:uppercase}.kpi strong{display:block;margin-top:4px;font-size:1.45rem}.kpi.win strong{color:var(--green)}.kpi.draw strong{color:var(--amber)}.kpi.loss strong{color:var(--red)}
    .split-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.split{padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--surface-raised)}.split-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.split-head strong{font-size:.78rem}.split-head span{color:var(--muted);font-size:.65rem}.split-record{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.split-record span{padding:7px;border-radius:8px;background:var(--surface-soft);color:var(--muted);font-size:.58rem;text-transform:uppercase}.split-record b{display:block;color:var(--ink);font-size:.88rem}
    .team-analysis-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    .trend-list{display:grid;gap:8px}.trend{display:grid;grid-template-columns:minmax(145px,1fr) minmax(90px,1.7fr) minmax(72px,auto);align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-raised)}.trend>span{color:var(--muted);font-size:.7rem;font-weight:750}.trend-bar{height:6px;overflow:hidden;border-radius:99px;background:var(--surface-soft)}.trend-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green-dark),var(--green))}.trend strong{font-size:.85rem;text-align:right;white-space:nowrap}
    .advanced-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}.advanced-stat{padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--surface-raised)}.advanced-stat span,.advanced-stat small{display:block;color:var(--muted);font-size:.59rem}.advanced-stat strong{display:block;margin:5px 0 2px;font-size:1rem}.advanced-stat small{line-height:1.35}
    .form-strip{display:flex;gap:6px}.form-dot{width:27px;height:27px;display:grid;place-items:center;border-radius:8px;font-size:.7rem;font-weight:900}.form-dot.V{background:rgba(84,227,142,.15)}.form-dot.E{background:rgba(245,190,91,.15)}.form-dot.D{background:rgba(255,124,120,.15)}
    .match-list{display:grid;gap:7px}.recent-match-shell{position:relative}.recent-match{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 54px 12px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-raised);color:var(--ink);text-decoration:none}.recent-match:hover{border-color:rgba(84,227,142,.35)}.recent-match time{color:var(--muted);font-size:.63rem;text-transform:uppercase}.recent-opponent{min-width:0}.recent-opponent small,.recent-opponent strong,.recent-opponent span{display:block}.recent-opponent small{color:var(--cyan);font-size:.57rem;font-weight:850;text-transform:uppercase}.recent-opponent strong{margin-top:3px;overflow:hidden;font-size:.76rem;text-overflow:ellipsis;white-space:nowrap}.recent-opponent span{margin-top:3px;color:var(--muted);font-size:.61rem}.recent-result{display:flex;align-items:center;gap:8px}.recent-score{min-width:34px;font-size:.92rem;font-weight:900;text-align:right;white-space:nowrap}.recent-favorite{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface-soft);color:var(--muted);font-size:1.05rem;cursor:pointer}.recent-favorite:hover,.recent-favorite.active{border-color:var(--green);color:var(--green)}.coverage-box{margin-top:12px;padding:14px;border:1px dashed rgba(245,190,91,.26);border-radius:12px;color:var(--muted);font-size:.7rem}.coverage-box b{color:var(--amber)}
    .squad-section{margin-top:14px}.squad-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:15px}.squad-head h2{margin:0}.squad-filter{display:grid;gap:5px;color:var(--muted);font-size:.59rem;font-weight:800;text-transform:uppercase}.squad-filter select{min-width:210px}.squad-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.squad-summary span{padding:7px 10px;border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:.64rem}.squad-summary b{color:var(--ink)}.squad-table td:nth-child(2),.squad-table th:nth-child(2){text-align:left}.squad-player{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:800;text-decoration:none}.squad-player img{width:28px;height:28px;object-fit:cover;border-radius:8px;background:var(--surface-soft)}.per90{color:var(--cyan);font-size:.58rem;white-space:nowrap}.total-value{display:block;font-weight:900}
    @media(max-width:900px){.team-hero{grid-template-columns:1fr}.team-actions{justify-content:flex-start}.profile-grid,.team-analysis-grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:590px){.team-page{width:min(100% - 20px,1240px);padding-top:22px}.team-nav{overflow-x:auto;flex-wrap:nowrap;white-space:nowrap}.team-hero{padding:22px 18px}.team-identity{align-items:flex-start;flex-direction:column}.team-logo{width:68px;height:68px}.team-actions{display:grid;grid-template-columns:1fr;width:100%}.team-actions a,.team-actions button{min-height:44px}.profile-controls>*{width:100%!important}.coverage-label{margin-left:0}.profile-card{padding:15px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.split-grid{grid-template-columns:1fr}.trend{grid-template-columns:1fr auto}.trend-bar{grid-column:1/-1;grid-row:2}.advanced-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.recent-match{grid-template-columns:52px minmax(0,1fr)}.recent-result{grid-column:2;justify-content:flex-start}.recent-score{text-align:left}.squad-head{align-items:stretch;flex-direction:column}.squad-filter select{width:100%;min-width:0}}
    @media(max-width:360px){.advanced-summary{grid-template-columns:1fr}.form-strip{flex-wrap:wrap}}
  </style>
</head>
<body>
<main class="team-page">
  <nav class="team-nav"><a href="/equipos.html">← Equipos</a><a href="/">Inicio</a><a href="/comparador.html">Comparador</a><a href="/competiciones.html">Competiciones</a></nav>
  <section class="team-hero">
    <div class="team-identity"><img id="team-logo" class="team-logo" alt="" hidden><div><p class="eyebrow">Ficha de equipo</p><h1 id="team-name">Cargando…</h1><p id="team-sub" class="team-sub">Leyendo temporada y cobertura.</p></div></div>
    <div class="team-actions"><button id="favorite-team" type="button">☆ Guardar favorito</button><a id="compare-local" href="/comparador.html">Comparar como local</a><a id="compare-away" href="/comparador.html">Comparar como visitante</a></div>
  </section>
  <div class="profile-controls">
    <label for="season">Temporada</label><select id="season"><option value="">Cargando temporadas…</option></select>
    <label for="scope">Condición</label><select id="scope"><option value="general">General</option><option value="local">Como local</option><option value="visitante">Como visitante</option></select>
    <label for="limit">Muestra</label><select id="limit"><option value="all">Temporada completa</option><option value="5">Últimos 5</option><option value="3">Últimos 3</option></select>
    <label for="period">Periodo</label><select id="period"><option value="0">Partido completo</option><option value="1">1.º tiempo</option><option value="2">2.º tiempo</option></select>
    <label for="format">Mostrar</label><select id="format"><option value="percent">Porcentaje</option><option value="count">Veces cumplidas</option></select>
    <span class="coverage-label" id="coverage">Calculando cobertura…</span>
  </div>
  <div id="profile-content"><div class="loader">Construyendo ficha…</div></div>
  <section id="team-players" class="profile-card squad-section"><div class="loader">Cargando estadísticas de jugadores…</div></section>
  <div id="team-history" style="margin-top:14px"></div>
</main>
<script>
const params=new URLSearchParams(location.search);const TEAM=Number(params.get('id'));const LEAGUE=Number(params.get('league'));const SEASON_INICIAL=params.has('season')?Number(params.get('season')):null;let temporadaActual=Number.isInteger(SEASON_INICIAL)?SEASON_INICIAL:null;let datosActuales=null;const CLAVE_FORMATO_FRECUENCIA='football-stats-display-mode';let formatoFrecuencia=localStorage.getItem(CLAVE_FORMATO_FRECUENCIA)==='count'?'count':'percent';
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const pct=v=>v?.porcentaje??'—';const prom=(total,n)=>n?(total/n).toFixed(2):'—';
function record(stats){return `<div class="split-record"><span>V<b>${stats.ganados}</b></span><span>E<b>${stats.empatados}</b></span><span>D<b>${stats.perdidos}</b></span></div>`}
function trend(nombre,valor,muestra){const numero=Number(valor?.porcentaje)||0;const lectura=formatoFrecuencia==='count'?`${valor?.total??0} de ${muestra}`:`${pct(valor)}%`;return `<div class="trend"><span>${nombre}</span><div class="trend-bar"><i style="width:${Math.min(numero,100)}%"></i></div><strong>${lectura}</strong></div>`}
function metrica(nombre,favor,contra){const valor=v=>v===null||v===undefined?'—':Number(v).toLocaleString('es-MX',{maximumFractionDigits:2});return `<div class="advanced-stat"><span>${nombre}</span><strong>${valor(favor)}</strong><small>Rival / contra: ${valor(contra)}</small></div>`}
function pintarHistorial(data){const cont=document.getElementById('team-history');if(!data?.temporadas?.length){cont.innerHTML='';return}cont.innerHTML=`<section class="profile-card"><h2>Trayectoria por temporada <small>archivo histórico; no alimenta picks actuales</small></h2><div class="table-scroll"><table class="standings"><thead><tr><th>Temporada</th><th>Pos.</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>PTS</th></tr></thead><tbody>${data.temporadas.map(t=>`<tr><td>${esc(t.etiqueta)}</td><td><b>${t.posicion}/${t.equipos}</b></td><td>${t.jugados}</td><td>${t.ganados}</td><td>${t.empatados}</td><td>${t.perdidos}</td><td>${t.goles_favor}</td><td>${t.goles_contra}</td><td>${t.diferencia>0?'+':''}${t.diferencia}</td><td><b>${t.puntos}</b></td></tr>`).join('')}</tbody></table></div><p class="method-note">Posición reconstruida con los marcadores almacenados. En torneos con fases, playoffs o grupos representa la tabla acumulada y puede no coincidir con la clasificación oficial.</p></section>`}
const ritmo90=(valor,minutos)=>minutos?Number((Number(valor||0)*90/minutos).toFixed(2)):'—';
function celdaRitmo(total,minutos){return `<span class="total-value">${total??0}</span><small class="per90">${ritmo90(total,minutos)} /90</small>`}
async function cargarJugadores(jornada=''){const cont=document.getElementById('team-players');cont.innerHTML='<div class="loader">Calculando plantel…</div>';const q=new URLSearchParams({league:LEAGUE,season:temporadaActual,team:TEAM,limite:200});if(jornada)q.set('round',jornada);const r=await fetch('/api/jugadores?'+q);const d=await r.json().catch(()=>({}));if(!r.ok){cont.innerHTML=`<div class="warning">${esc(d.error||'No fue posible cargar los jugadores.')}</div>`;return}const minutos=d.jugadores.reduce((t,p)=>t+(Number(p.minutos)||0),0);const goles=d.jugadores.reduce((t,p)=>t+(Number(p.goles)||0),0);const asistencias=d.jugadores.reduce((t,p)=>t+(Number(p.asistencias)||0),0);const filas=d.jugadores.map((p,i)=>`<tr><td>${i+1}</td><td><a class="squad-player" href="/jugador.html?id=${p.id}&league=${LEAGUE}&season=${temporadaActual}">${p.foto?`<img src="${esc(p.foto)}" alt="">`:''}<span>${esc(p.nombre)}</span></a></td><td>${esc(p.posicion||'—')}</td><td>${p.partidos}</td><td>${p.minutos}</td><td>${celdaRitmo(p.goles,p.minutos)}</td><td>${celdaRitmo(p.asistencias,p.minutos)}</td><td>${p.calificacion??'—'}</td><td>${celdaRitmo(p.tiros,p.minutos)}</td><td>${celdaRitmo(p.tiros_puerta,p.minutos)}</td><td>${celdaRitmo(p.pases_clave,p.minutos)}</td><td>${celdaRitmo(p.entradas,p.minutos)}</td><td>${celdaRitmo(p.atajadas,p.minutos)}</td><td>${p.amarillas}</td></tr>`).join('');cont.innerHTML=`<div class="squad-head"><div><p class="eyebrow">Plantel</p><h2>Estadísticas de jugadores <small>totales y promedio por 90 minutos</small></h2></div><label class="squad-filter">Periodo<select id="player-round"><option value="">Temporada completa</option>${d.jornadas.map(j=>`<option value="${esc(j.nombre)}" ${j.nombre===jornada?'selected':''}>${esc(j.nombre)}</option>`).join('')}</select></label></div><div class="squad-summary"><span>Jugadores <b>${d.jugadores.length}</b></span><span>Minutos registrados <b>${minutos.toLocaleString('es-MX')}</b></span><span>Goles <b>${goles}</b></span><span>Asistencias <b>${asistencias}</b></span></div><div class="table-scroll"><table class="standings squad-table"><thead><tr><th>#</th><th>Jugador</th><th>Pos.</th><th>PJ</th><th>Min</th><th>G</th><th>A</th><th>Nota</th><th>Tiros</th><th>A puerta</th><th>Pases clave</th><th>Entradas</th><th>Atajadas</th><th>TA</th></tr></thead><tbody>${filas||'<tr><td colspan="14">No hay estadísticas individuales para esta selección.</td></tr>'}</tbody></table></div><p class="method-note">La cifra principal es el total del periodo; debajo se muestra el ritmo por 90 minutos. La calificación es el promedio de los partidos con nota disponible.</p>`;document.getElementById('player-round').onchange=e=>cargarJugadores(e.target.value)}
function pintar(data){const s=data.stats;const avanzadas=s.avanzadas||{};const a=avanzadas.promedios||{};const muestras=avanzadas.muestras||{};datosActuales=data;temporadaActual=Number(data.info.temporada);document.title=`${data.info.equipo} · Ficha`;document.getElementById('team-name').textContent=data.info.equipo;document.getElementById('team-sub').textContent=`${data.info.liga||'Competición'} · temporada ${data.info.temporada_etiqueta||data.info.temporada} · ${data.info.periodo}`;document.getElementById('coverage').textContent=`Cobertura avanzada ${data.info.cobertura.estadisticas}/${data.info.cobertura.partidos}`;const selector=document.getElementById('season');if([...selector.options].some(o=>Number(o.value)===temporadaActual))selector.value=String(temporadaActual);actualizarEnlaces();const fav=document.getElementById('favorite-team');fav.textContent=FutbolLibrary.esFavorito(TEAM,LEAGUE)?'★ En favoritos':'☆ Guardar favorito';fav.classList.toggle('active',FutbolLibrary.esFavorito(TEAM,LEAGUE));fav.dataset.nombre=data.info.equipo;fav.dataset.competicion=data.info.liga||'Competición';
  const forma=data.partidos.slice(0,5).map(p=>`<span class="form-dot ${p.resultado}">${p.resultado}</span>`).join('')||'—';
  const partidos=data.partidos.slice(0,8).map(p=>{const dia=new Date(p.fecha).toISOString().slice(0,10);const liga=p.liga_id||LEAGUE;const url=`/partido.html?local=${p.local_id}&visitante=${p.visitante_id}&liga=${liga}&partido=${p.id}&fecha=${dia}`;const condicion=p.ubicacion==='local'?'Local':'Visitante';const favorito=FutbolLibrary.esPartidoFavorito(p.id);const local=p.ubicacion==='local'?{id:p.local_id,nombre:data.info.equipo}:{id:p.local_id,nombre:p.rival};const visitante=p.ubicacion==='visitante'?{id:p.visitante_id,nombre:data.info.equipo}:{id:p.visitante_id,nombre:p.rival};return `<div class="recent-match-shell"><a class="recent-match" href="${url}"><time>${new Date(p.fecha).toLocaleDateString('es-MX',{day:'2-digit',month:'short'})}</time><div class="recent-opponent"><small>${condicion}</small><strong>${p.ubicacion==='local'?'VS':'@'} ${esc(p.rival)}</strong><span>Abrir Match Center →</span></div><div class="recent-result"><span class="recent-score">${esc(p.marcador)}</span><span class="form-dot ${p.resultado}">${p.resultado}</span></div></a><button type="button" class="recent-favorite ${favorito?'active':''}" data-team-match-favorite="${p.id}" data-league="${liga}" data-date="${esc(p.fecha)}" data-local-id="${local.id}" data-local-name="${esc(local.nombre)}" data-away-id="${visitante.id}" data-away-name="${esc(visitante.nombre)}" aria-label="${favorito?'Quitar partido de favoritos':'Marcar partido como favorito'}" aria-pressed="${favorito}">${favorito?'★':'☆'}</button></div>`}).join('');
  const muestraCorners=muestras.cornersTotales??avanzadas.muestra??0;
  const tendencias=`${trend('Más de 0.5 goles',s.over05,s.jugados)}${trend('Más de 1.5 goles',s.over15,s.jugados)}${trend('Más de 2.5 goles',s.over25,s.jugados)}${trend('Más de 3.5 goles',s.over35,s.jugados)}${trend('Menos de 1.5 goles',s.under15,s.jugados)}${trend('Menos de 2.5 goles',s.under25,s.jugados)}${trend('Menos de 3.5 goles',s.under35,s.jugados)}${trend('Ambos anotan',s.btts,s.jugados)}${trend('Equipo +1.5 goles',s.equipoOver15,s.jugados)}${trend('Rival +1.5 goles',s.rivalOver15,s.jugados)}${muestraCorners?trend('Más de 9.5 córners',avanzadas.cornersOver95,muestraCorners):''}`;
  const produccion=avanzadas.muestra?`<section class="profile-card" style="margin-top:14px"><h2>Producción por partido <small>promedios sólo con cobertura confirmada</small></h2><div class="advanced-summary">${metrica('Tiros',a.tirosFavor,a.tirosContra)}${metrica('Tiros a puerta',a.tirosPuertaFavor,a.tirosPuertaContra)}${metrica('Córners',a.cornersFavor,a.cornersContra)}${metrica('Tarjetas',a.tarjetasFavor,a.tarjetasContra)}${metrica('Faltas',a.faltasFavor,a.faltasContra)}${metrica('Fueras de juego',a.offsidesFavor,a.offsidesContra)}</div></section>`:'';
  document.getElementById('profile-content').innerHTML=`<section class="profile-grid"><div class="profile-card"><h2>Rendimiento <small>${s.jugados} partidos</small></h2><div class="kpis"><div class="kpi win"><span>Victorias</span><strong>${s.ganados}</strong></div><div class="kpi draw"><span>Empates</span><strong>${s.empatados}</strong></div><div class="kpi loss"><span>Derrotas</span><strong>${s.perdidos}</strong></div><div class="kpi"><span>Goles favor</span><strong>${s.golesFavor}</strong></div><div class="kpi"><span>Goles contra</span><strong>${s.golesContra}</strong></div><div class="kpi"><span>Promedio</span><strong>${prom(s.golesFavor,s.jugados)}</strong></div></div><div class="split-grid"><div class="split"><div class="split-head"><strong>En casa</strong><span>${data.local.jugados} partidos</span></div>${record(data.local)}</div><div class="split"><div class="split-head"><strong>Fuera</strong><span>${data.visitante.jugados} partidos</span></div>${record(data.visitante)}</div></div></div><aside class="profile-card"><h2>Forma reciente</h2><div class="form-strip">${forma}</div><div class="coverage-box"><b>${data.info.cobertura.estadisticas}/${data.info.cobertura.partidos}</b> partidos de esta vista tienen estadísticas avanzadas. Los promedios omiten métricas que el proveedor no entregó.</div></aside></section><section class="profile-grid team-analysis-grid" style="margin-top:14px"><div class="profile-card"><h2>Tendencias de mercado <small>frecuencia observada</small></h2><div class="trend-list">${tendencias}</div></div><aside class="profile-card"><h2>Partidos recientes</h2><div class="match-list">${partidos||'<div class="empty-state">No hay partidos para esta selección.</div>'}</div></aside></section>${produccion}`;
}
function actualizarEnlaces(){const seasonQuery=Number.isInteger(temporadaActual)?`&seasonLocal=${temporadaActual}`:'';const awaySeasonQuery=Number.isInteger(temporadaActual)?`&seasonVisitante=${temporadaActual}`:'';document.getElementById('compare-local').href=`/comparador.html?leagueLocal=${LEAGUE}&local=${TEAM}${seasonQuery}`;document.getElementById('compare-away').href=`/comparador.html?leagueVisitante=${LEAGUE}&visitante=${TEAM}${awaySeasonQuery}`}
async function cargarHistorial(){const h=await fetch(`/api/equipos/${TEAM}/historial?league=${LEAGUE}`);if(!h.ok)return;const historial=await h.json();pintarHistorial(historial);const temporadas=historial.temporadas||[];const sel=document.getElementById('season');sel.innerHTML=temporadas.map(t=>`<option value="${t.temporada}">${esc(t.etiqueta)}</option>`).join('')||'<option value="">Sin temporadas finalizadas</option>';if(!temporadas.some(t=>t.temporada===temporadaActual))temporadaActual=temporadas[0]?.temporada??temporadaActual;if(Number.isInteger(temporadaActual))sel.value=String(temporadaActual)}
async function cargar(){if(!Number.isInteger(TEAM)||!Number.isInteger(LEAGUE)){document.getElementById('profile-content').innerHTML='<div class="warning">Falta seleccionar un equipo y una competición.</div>';return}document.getElementById('profile-content').innerHTML='<div class="loader">Actualizando estadísticas…</div>';const scope=document.getElementById('scope').value;const limit=document.getElementById('limit').value;const half=document.getElementById('period').value;const q=new URLSearchParams({league:LEAGUE,scope,limit,half});if(Number.isInteger(temporadaActual))q.set('season',temporadaActual);const r=await fetch(`/api/equipos/${TEAM}/estadisticas-detalladas?${q}`);const data=await r.json().catch(()=>({}));if(!r.ok){document.getElementById('profile-content').innerHTML=`<div class="warning">${esc(data.error||'No fue posible cargar el equipo.')}</div>`;return}pintar(data)}
document.addEventListener('click',event=>{const b=event.target.closest('[data-team-match-favorite]');if(!b)return;FutbolLibrary.alternarPartidoFavorito({api_id:Number(b.dataset.teamMatchFavorite),liga_id:Number(b.dataset.league),fecha:b.dataset.date,local:{id:Number(b.dataset.localId),nombre:b.dataset.localName},visitante:{id:Number(b.dataset.awayId),nombre:b.dataset.awayName}});if(datosActuales)pintar(datosActuales)});
document.addEventListener('DOMContentLoaded',async()=>{const img=document.getElementById('team-logo');img.src=`/api/equipos/${TEAM}/escudo`;img.hidden=false;document.getElementById('format').value=formatoFrecuencia;document.getElementById('favorite-team').onclick=()=>{const b=document.getElementById('favorite-team');FutbolLibrary.alternarFavorito({id:TEAM,league:LEAGUE,nombre:b.dataset.nombre||`Equipo ${TEAM}`,competicion:b.dataset.competicion});b.textContent=FutbolLibrary.esFavorito(TEAM,LEAGUE)?'★ En favoritos':'☆ Guardar favorito';b.classList.toggle('active',FutbolLibrary.esFavorito(TEAM,LEAGUE))};for(const id of ['scope','limit','period'])document.getElementById(id).onchange=cargar;document.getElementById('season').onchange=()=>{temporadaActual=Number(document.getElementById('season').value);history.replaceState(null,'',`/equipo.html?id=${TEAM}&league=${LEAGUE}&season=${temporadaActual}`);actualizarEnlaces();cargar();cargarJugadores()};document.getElementById('format').onchange=event=>{formatoFrecuencia=event.target.value==='count'?'count':'percent';localStorage.setItem(CLAVE_FORMATO_FRECUENCIA,formatoFrecuencia);if(datosActuales)pintar(datosActuales)};actualizarEnlaces();await cargarHistorial();await Promise.all([cargar(),cargarJugadores()])});
</script>
