<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil de jugador</title><meta name="theme-color" content="#07100d"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/catalog.css"><script src="/auth-client.js"></script></head><body><main class="catalog player-profile">
<nav class="catalog-nav"><a href="/jugadores.html">← Jugadores</a><a href="/">Inicio</a><a href="/equipos.html">Equipos</a><a href="/comparador.html">Comparador</a></nav>
<header class="player-hero"><img id="photo" hidden alt=""><div><p class="eyebrow">Perfil individual</p><h1 id="name">Cargando jugador…</h1><p id="meta"></p></div></header>
<section id="player-content"><div class="loader">Leyendo rendimientos guardados…</div></section>
</main><script>
const p=new URLSearchParams(location.search);const ID=Number(p.get('id'));const LEAGUE=p.has('league')?Number(p.get('league')):null;const SEASON=p.has('season')?Number(p.get('season')):null;const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');const n=v=>Number(v)||0;
document.addEventListener('DOMContentLoaded',async()=>{if(!Number.isInteger(ID)){document.getElementById('player-content').innerHTML='<div class="warning">Jugador inválido.</div>';return}const q=new URLSearchParams();if(Number.isInteger(LEAGUE))q.set('league',LEAGUE);if(Number.isInteger(SEASON))q.set('season',SEASON);const r=await fetch(`/api/jugadores/${ID}${q.size?`?${q}`:''}`);const d=await r.json().catch(()=>({}));if(!r.ok){document.getElementById('name').textContent='Perfil sin datos';document.getElementById('player-content').innerHTML=`<div class="warning">${esc(d.error||'No disponible')}</div>`;return}document.title=`${d.jugador.nombre} · Jugador`;document.getElementById('name').textContent=d.jugador.nombre;document.getElementById('meta').textContent=`${d.jugador.equipo.nombre} · ${d.jugador.posicion||'Posición sin registrar'} · ${d.partidos} partidos${Number.isInteger(SEASON)?` · temporada ${SEASON}`:''}`;if(d.jugador.foto){const img=document.getElementById('photo');img.src=d.jugador.foto;img.alt=`Foto de ${d.jugador.nombre}`;img.hidden=false}const kpis=[['Minutos',d.totales.minutos],['Goles',d.totales.goles],['Asistencias',d.totales.asistencias],['Tiros',d.totales.tiros],['A puerta',d.totales.tiros_puerta],['Pases clave',d.totales.pases_clave],['Faltas',d.totales.faltas_cometidas],['Amarillas',d.totales.amarillas]];const filas=d.recientes.map(x=>`<tr><td>${new Date(x.fecha).toLocaleDateString('es-MX',{day:'2-digit',month:'short'})}</td><td>${esc(x.rival?.nombre||'Rival no disponible')}</td><td>${n(x.minutos)}</td><td>${n(x.goles)}</td><td>${n(x.asistencias)}</td><td>${n(x.tiros)} / ${n(x.tiros_puerta)}</td><td>${x.calificacion??'—'}</td></tr>`).join('');document.getElementById('player-content').innerHTML=`<div class="player-kpis">${kpis.map(([a,b])=>`<div><span>${a}</span><strong>${b}</strong></div>`).join('')}</div><div class="competition-layout"><article class="competition-panel"><div class="competition-panel-head"><div><p class="eyebrow">Partido a partido</p><h2>Rendimiento reciente</h2></div></div><div class="table-scroll"><table class="standings"><thead><tr><th>Fecha</th><th>Rival</th><th>Min</th><th>G</th><th>A</th><th>T / AP</th><th>Nota</th></tr></thead><tbody>${filas}</tbody></table></div></article><aside class="competition-panel"><p class="eyebrow">Ritmo por 90</p><h2>Promedios</h2>${[['Goles',d.promedios_90.goles],['Asistencias',d.promedios_90.asistencias],['Tiros',d.promedios_90.tiros],['Tiros a puerta',d.promedios_90.tiros_puerta],['Faltas',d.promedios_90.faltas_cometidas],['Tarjetas',d.promedios_90.amarillas]].map(([a,b])=>`<div class="player-average"><span>${a}</span><b>${b??'—'}</b></div>`).join('')}<p class="method-note">Promedios normalizados por minutos almacenados; no corrigen rival, rol ni estado del partido.</p></aside></div>`});
</script></body></html>
