<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jugadores</title><meta name="theme-color" content="#07100d"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/catalog.css"><script src="/auth-client.js"></script><script src="/search-utils.js"></script></head>
<body><main class="catalog">
  <nav class="catalog-nav"><a href="/">← Inicio</a><a href="/comparador.html">Comparador</a><a href="/equipos.html">Equipos</a><a href="/competiciones.html">Competiciones</a></nav>
  <header class="catalog-head"><div><p class="eyebrow">Rendimiento individual</p><h1>Datos de <span>jugadores.</span></h1><p>Esta sección se llenará automáticamente con minutos, tiros, goles, asistencias, faltas y tarjetas durante la sincronización por lotes.</p></div></header>
  <div class="catalog-controls"><select id="liga"><option value="">Todas las competiciones</option></select><input id="buscar" type="search" placeholder="Buscar jugador…"><button id="filtrar" type="button">Buscar</button></div>
  <div id="lista" class="catalog-grid"><div class="loader">Buscando jugadores…</div></div>
</main><script>
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
async function cargar(){const consulta=document.getElementById('buscar').value;const valor=document.getElementById('liga').value;const [league,season]=valor.split(':');const p=new URLSearchParams({q:consulta,limite:60});if(league)p.set('league',league);if(season)p.set('season',season);const r=await fetch('/api/jugadores?'+p);const d=await r.json().catch(()=>({}));const lista=document.getElementById('lista');if(!r.ok){lista.innerHTML=`<div class="warning">${esc(d.error||'No disponible')}</div>`;return}const jugadores=FutbolSearch.ordenar(d.jugadores,consulta,j=>j.nombre);lista.innerHTML=jugadores.map(j=>`<a class="catalog-card" href="/jugador.html?id=${j.id}${league?`&league=${league}`:''}"><div class="catalog-card-head">${j.foto?`<img src="${esc(j.foto)}" alt="Foto de ${esc(j.nombre)}">`:''}<div><h3>${esc(j.nombre)}</h3><p>${esc(j.equipos.join(', '))} · ${esc(j.posicion||'—')}</p></div></div><div class="metric-row"><span>Partidos<b>${j.partidos}</b></span><span>Goles<b>${j.goles}</b></span><span>Tiros puerta<b>${j.tiros_puerta}</b></span></div><small>${j.minutos} minutos en esta temporada · abrir historial en la liga →</small></a>`).join('')||'<div class="catalog-empty">Todavía no hay rendimientos individuales que coincidan. La sección se llenará con <b>npm run sync:details</b>.</div>'}
document.addEventListener('DOMContentLoaded',async()=>{const r=await fetch('/api/home/competiciones');const d=await r.json();document.getElementById('liga').innerHTML='<option value="">Todas las competiciones y temporadas</option>'+d.competiciones.map(c=>`<option value="${c.id}:${c.temporada}">${esc(c.nombre)} · ${c.temporada_etiqueta||c.temporada}</option>`).join('');document.getElementById('filtrar').onclick=cargar;document.getElementById('liga').onchange=cargar;document.getElementById('buscar').onkeydown=e=>{if(e.key==='Enter')cargar()};cargar()});
</script></body></html>
